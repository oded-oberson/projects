<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>OBERSON GO</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23fff'/%3E%3Ccircle cx='16' cy='16' r='11.5' fill='none' stroke='%23000' stroke-width='3'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="OBERSON GO">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://pdbgmmzjghxophcdxchg.supabase.co" crossorigin>
<link rel="preconnect" href="https://use.typekit.net" crossorigin>
<link rel="preconnect" href="https://oberson-arch.com" crossorigin>
<link rel="preload" as="image" href="logo-draw.v5.webp">
<link rel="stylesheet" href="https://use.typekit.net/iqp8fqo.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  @font-face { font-family: "Narkiss Block"; font-weight: 400; font-style: normal; font-display: swap; src: url("https://oberson-arch.com/wp-content/themes/oberson/fonts/NarkissBlock-Regular.woff2") format("woff2"); }
  :root { color-scheme: light; }
  html, body { height: 100%; margin: 0; background: #fff; }
  #boot { position: fixed; inset: 0; z-index: 1000; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: 24px; transition: opacity .5s ease; }
  #boot.out { opacity: 0; pointer-events: none; }
  #boot-brand { display: flex; align-items: baseline; justify-content: center; direction: ltr; }
  #boot-brand { --lw: min(300px, 52vw); }
  #boot-logo { position: relative; width: var(--lw); margin-right: calc(var(--lw) * .306); aspect-ratio: 823 / 139; background: url(logo-draw.v5.webp) no-repeat 0 0 / 400% auto; }
  /* OBERSON GO: once the logo is fully drawn, the GO that is part of the wordmark (same stroke, G touching the N) appears in Pantone Green C;
     the green marks (dot in the O, GO) sit on the vector logo's bounds inside the sprite frame (x from 0.36%, y 1.91%–97.36%) */
  #boot-go { position: absolute; left: 0.36%; top: 1.91%; height: 95.45%; width: auto; color: #00ab4e; opacity: 0; transition: opacity .35s ease; overflow: visible; }
  #boot.full #boot-go { opacity: 1; }
  #boot.leaving #boot-go { opacity: 0; }
  #boot-logo.static { background: url(logo.svg) no-repeat center / contain !important; }
  #boot.leaving #boot-pct, #boot.leaving #boot-bar, #boot.leaving #boot-msg { opacity: 0; transition: opacity .25s ease; }
  #boot-pct { font-family: "futura-pt", "Narkiss Block", Arial, sans-serif; font-weight: 300; font-size: 34px; line-height: 1; letter-spacing: .08em; color: #000; font-variant-numeric: tabular-nums; direction: ltr; min-height: 34px; }
  #boot-bar { width: min(360px, 62vw); height: 1px; background: #e4e4e4; position: relative; direction: ltr; }
  #boot-bar i { position: absolute; left: 0; top: -0.5px; height: 2px; width: 0; background: #000; }
  #boot-msg { font-family: "Narkiss Block", "futura-pt", Arial, sans-serif; font-weight: 400; font-size: 14px; letter-spacing: .06em; color: #8a8a8a; min-height: 21px; text-align: center; line-height: 1.5; }
  #boot-msg.err { color: #a11f1f; }
  #boot-msg .again { display: inline-block; margin-top: 12px; padding: 6px 14px; border: 1px solid #000; background: #fff; color: #000; font: inherit; letter-spacing: .06em; cursor: pointer; }
  #boot-msg .again:hover { background: #000; color: #fff; }
  @media (prefers-reduced-motion: reduce) { #boot { transition: none; } }
</style>
</head>
<body>
<div id="boot" role="status" aria-live="polite">
  <div id="boot-brand"><div id="boot-logo" role="img" aria-label="OBERSON GO"><svg id="boot-go" viewBox="0 0 1306 162.4" aria-hidden="true"><circle class="logo-go" cx="76.75" cy="81.3" r="19" fill="currentColor"/><g class="logo-go" fill="none" stroke="currentColor" stroke-width="10.7"><path d="M1147.25 81.2A71.15 75.85 0 1 1 1130.60 32.44"/><path d="M1076.10 81.2H1152.60"/><ellipse cx="1229.10" cy="81.2" rx="71.15" ry="75.85"/></g></svg></div></div>
  <div id="boot-pct">0%</div>
  <div id="boot-bar"><i></i></div>
  <div id="boot-msg">טוען את המערכת…</div>
</div>
<script>
// Loader (v4.0 — OBERSON GO wordmark with the GO drawn into it; PWA manifest + service worker; the application page comes from app.html on this origin or, as a
// fallback, from ordered text blocks in Supabase (public.site_blocks / page = 'app') — see site_meta below): draws the boot screen, fetches the page, injects it into this document, and keeps reporting
// progress that the application itself sends through window.__boot until its first real render.
// The logo is drawn frame by frame as a direct function of the displayed percentage (sprite grid
// logo-draw.v5.webp (versioned name so the page and the sprite never mismatch in caches): 105 frames in 4 columns, blank -> full logo, 1.5x resolution with vector-crisp
// edges); on exit the same frames run backwards so the logo un-draws before the curtain lifts.
(() => {
  const SB_URL = 'https://pdbgmmzjghxophcdxchg.supabase.co';
  const SB_KEY = 'sb_publishable_bX-xcucDh5W1ZwxQNVnH6g_3og7abIP';
  const PAGE = 52;                 // rows per request; the first request reveals the total, the rest run in parallel
  const P_BLOCKS = [4, 50];        // progress span (in %) for fetching the page blocks
  const P_INJECT = 56;             // progress after the page is injected and its scripts have run
  const WATCHDOG_MS = 25000;       // never keep the curtain up longer than this after the app started

  const SPR_DRAW = { n: 105, cols: 4, rows: 27 }, UNDRAW_MS = 380;   // sprite grid and the exit duration

  const $ = (id) => document.getElementById(id);
  const boot = $('boot'), logoEl = $('boot-logo'), pctEl = $('boot-pct'), barEl = $('boot-bar').firstElementChild, msgEl = $('boot-msg');
  let target = 0, shown = 0, raf = 0, finished = false, failed = false, logoOk = false;

  // The logo strip: percent -> frame. If the strip cannot load, show the static logo instead.
  const drawImg = new Image();
  drawImg.onload = () => { logoOk = true; };
  drawImg.onerror = () => { logoEl.classList.add('static'); };
  drawImg.src = 'logo-draw.v5.webp';
  const framePos = (i, s) => { const k = Math.max(0, Math.min(s.n - 1, i)); return ((k % s.cols) / (s.cols - 1) * 100) + '% ' + (Math.floor(k / s.cols) / (s.rows - 1) * 100) + '%'; };
  const paint = () => {
    const v = Math.round(shown);
    pctEl.textContent = v + '%'; barEl.style.width = shown + '%';
    if (shown >= 99.5) boot.classList.add('full');
    if (!logoEl.classList.contains('static')) logoEl.style.backgroundPosition = framePos(Math.round(shown / 100 * (SPR_DRAW.n - 1)), SPR_DRAW);
  };
  // requestAnimationFrame pauses in hidden tabs; fall back to a timer there so the readout still settles.
  const schedule = (fn) => (document.hidden ? (setTimeout(fn, 120), -1) : requestAnimationFrame(fn));
  const tick = () => {
    raf = 0;
    const d = target - shown;
    if (d <= 0.05) { shown = target; paint(); return; }
    shown += document.hidden ? d : Math.max(0.3, d * 0.16);
    paint();
    raf = schedule(tick);
  };
  document.addEventListener('visibilitychange', () => { if (!document.hidden && !raf && target > shown) raf = schedule(tick); });
  const set = (p, msg) => {
    if (failed) return;
    target = Math.max(target, Math.min(100, p));
    if (msg) msgEl.textContent = msg;
    if (!raf) raf = requestAnimationFrame(tick);
  };
  const finish = () => {
    if (finished || failed) return;
    finished = true;
    set(100, '');
    let hidden = false;
    const hide = () => { if (hidden) return; hidden = true; boot.classList.add('out'); setTimeout(() => boot.remove(), 600); };
    // exit: the logo un-draws (the original animation's opening), the curtain fades during the second half
    const leave = () => {
      boot.classList.add('leaving');
      if (!logoOk || document.hidden || logoEl.classList.contains('static')) { hide(); return; }
      const t1 = performance.now();
      const step = (now) => {
        const k = Math.min(1, (now - t1) / UNDRAW_MS);
        logoEl.style.backgroundPosition = framePos(Math.round((1 - k) * (SPR_DRAW.n - 1)), SPR_DRAW);
        if (k >= 0.55) hide();
        if (k < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    };
    const t0 = Date.now();
    const wait = () => ((shown >= 99.5 || Date.now() - t0 > 1500) ? setTimeout(leave, 140) : setTimeout(wait, 40));
    wait();
  };
  const fail = (html) => {
    failed = true;
    if (raf > 0) cancelAnimationFrame(raf); raf = 0;
    msgEl.className = 'err';
    msgEl.innerHTML = html + '<br><button type="button" class="again" onclick="location.reload()">לטעון שוב</button>';
  };
  window.__boot = { set: (p, msg) => set(p * 100, msg), done: finish, fail };
  if ('serviceWorker' in navigator && location.protocol === 'https:') window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });

  const rest = (from, to) => fetch(SB_URL + '/rest/v1/site_blocks?select=body&page=eq.app&order=seq.asc', {
    headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, Range: from + '-' + to, Prefer: 'count=exact' },
    cache: 'no-store',
  }).then(async (r) => {
    if (!r.ok && r.status !== 206) throw new Error('HTTP ' + r.status);
    const total = parseInt(String(r.headers.get('content-range') || '').split('/')[1], 10);
    return { rows: await r.json(), total: Number.isFinite(total) ? total : NaN };
  });

  async function fetchBlocks() {
    const first = await rest(0, PAGE - 1);
    const pages = [first.rows];
    let got = first.rows.length;
    const total = Number.isFinite(first.total) ? first.total : NaN;
    const span = P_BLOCKS[1] - P_BLOCKS[0];
    const report = () => set(P_BLOCKS[0] + span * (Number.isFinite(total) && total > 0 ? Math.min(1, got / total) : 0.5));
    report();
    if (Number.isFinite(total)) {
      const n = Math.ceil(total / PAGE);
      const rest_ = [];
      for (let i = 1; i < n; i++) rest_.push(rest(i * PAGE, (i + 1) * PAGE - 1).then((r) => { pages[i] = r.rows; got += r.rows.length; report(); }));
      await Promise.all(rest_);
    } else {
      for (let from = PAGE; first.rows.length === PAGE; from += PAGE) {   // unknown total: page sequentially
        const r = await rest(from, from + PAGE - 1); pages.push(r.rows); got += r.rows.length; report();
        if (r.rows.length < PAGE) break;
      }
    }
    const html = pages.flat().map((x) => x.body).join('');
    if (!html.trim()) throw new Error('empty');
    return html;
  }

  const loadScript = (src) => new Promise((res, rej) => {
    if ([...document.scripts].some((s) => s.src === src || s.getAttribute('src') === src)) return res();
    const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('script ' + src)); document.head.appendChild(s);
  });

  async function inject(html) {
    const doc = new DOMParser().parseFromString(html, 'text/html');
    for (const a of [...doc.documentElement.attributes]) document.documentElement.setAttribute(a.name, a.value);
    const waits = [], inline = [];
    for (const el of [...doc.head.children]) {
      const tag = el.tagName;
      if (tag === 'TITLE') document.title = el.textContent;
      else if (tag === 'SCRIPT') { if (el.getAttribute('src')) waits.push(loadScript(el.getAttribute('src'))); else inline.push(el.textContent); }
      else if (tag === 'META' && (el.getAttribute('charset') || el.getAttribute('name') === 'viewport')) continue;
      else if (tag === 'LINK' && el.rel === 'icon') { const old = document.querySelector('link[rel="icon"]'); if (old) old.href = el.getAttribute('href'); else document.head.appendChild(document.importNode(el, true)); }
      else if (tag === 'LINK' && [...document.querySelectorAll('link')].some((l) => l.getAttribute('href') === el.getAttribute('href'))) continue;
      else document.head.appendChild(document.importNode(el, true));
    }
    for (const a of [...doc.body.attributes]) if (a.name !== 'style') document.body.setAttribute(a.name, a.value);
    for (const el of [...doc.body.childNodes]) {
      if (el.nodeType === 1 && el.tagName === 'SCRIPT') { if (el.getAttribute('src')) waits.push(loadScript(el.getAttribute('src'))); else inline.push(el.textContent); }
      else document.body.appendChild(document.importNode(el, true));
    }
    await Promise.all(waits);
    set(P_INJECT, 'מפעיל…');
    for (const code of inline) { const s = document.createElement('script'); s.textContent = code; document.body.appendChild(s); }
  }

  /* Where the application page lives is decided by one small row (site_meta / app): "pages" = app.html on this
     origin (uploaded with each build), "blocks" = public.site_blocks in Supabase (the fallback when GitHub is not reachable). */
  async function fetchMeta() {
    try {
      const r = await fetch(SB_URL + '/rest/v1/site_meta?select=data&id=eq.app', { headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY }, cache: 'no-store' });
      if (!r.ok) return null;
      const rows = await r.json();
      return rows && rows[0] ? rows[0].data : null;
    } catch (e) { return null; }
  }
  async function fetchPage(build) {
    const r = await fetch('app.html?v=' + encodeURIComponent(build || Date.now()), { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const total = Number(r.headers.get('content-length')) || 0;
    const span = P_BLOCKS[1] - P_BLOCKS[0];
    if (!r.body || !r.body.getReader) { const html = await r.text(); set(P_BLOCKS[1]); return html; }
    const reader = r.body.getReader(); const chunks = []; let got = 0;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value); got += value.length;
      set(P_BLOCKS[0] + span * (total ? Math.min(1, got / total) : Math.min(0.9, got / 320000)));
    }
    const html = new TextDecoder('utf-8').decode(concat(chunks));
    if (html.length < 10000) throw new Error('short');
    return html;
  }
  const concat = (arrs) => { const out = new Uint8Array(arrs.reduce((n, a) => n + a.length, 0)); let o = 0; arrs.forEach((a) => { out.set(a, o); o += a.length; }); return out; };

  (async () => {
    try {
      set(P_BLOCKS[0], 'טוען את המערכת…');
      const meta = await fetchMeta();
      let html;
      if (meta && meta.source === 'pages') {
        try { html = await fetchPage(meta.build); } catch (e) { console.warn('app.html unavailable, falling back to blocks', e); html = await fetchBlocks(); }
      } else html = await fetchBlocks();
      set(P_BLOCKS[1] + 2, 'בונה את הדף…');
      let scriptError = null;
      const onErr = (e) => { scriptError = e.error || e.message || e; };
      window.addEventListener('error', onErr);
      await inject(html);
      window.removeEventListener('error', onErr);
      if (scriptError && !finished) throw scriptError;
      setTimeout(() => { if (!finished && !failed) { console.warn('boot watchdog: app did not report readiness'); finish(); } }, WATCHDOG_MS);
    } catch (e) {
      console.error(e);
      fail('לא הצלחנו לטעון את המערכת.<br>בדקו את החיבור לאינטרנט ונסו שוב.');
    }
  })();
})();
</script>
</body>
</html>
