<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>OBERSON GO</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23fff'/%3E%3Ccircle cx='16' cy='16' r='11.5' fill='none' stroke='%23000' stroke-width='3'/%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link rel="preconnect" href="https://use.typekit.net" crossorigin>
<link rel="preconnect" href="https://oberson-arch.com" crossorigin>
<link rel="stylesheet" href="https://use.typekit.net/iqp8fqo.css">
<style>
  /* Narkiss Block: the office's Hebrew typeface, served from the office website (same files the site uses). */
  @font-face { font-family: "Narkiss Block"; font-weight: 400; font-style: normal; font-display: swap; src: url("https://oberson-arch.com/wp-content/themes/oberson/fonts/NarkissBlock-Regular.woff2") format("woff2"); }
  @font-face { font-family: "Narkiss Block"; font-weight: 200; font-style: normal; font-display: swap; src: url("https://oberson-arch.com/wp-content/themes/oberson/fonts/NarkissBlock-Extralight.woff2") format("woff2"); }

  :root {
    color-scheme: light;
    --bg: #ffffff;
    --surface: #ffffff;
    --surface-2: #f4f4f4;
    --ink: #000000;
    --ink-2: #4b4b4b;
    --ink-3: #8a8a8a;
    --line: #e4e4e4;
    --line-2: #bcbcbc;
    --rule: #000000;
    --accent: #000000;
    --accent-2: #333333;
    --accent-ink: #ffffff;
    --accent-soft: #f2f2f2;
    --accent-soft-2: #d9d9d9;
    --bar: #000000;
    --bar-2: #cfcfcf;
    --good: #3f8f5f;
    --good-ink: #256b44;
    --good-soft: #eaf3ed;
    --warn: #d5a021;
    --warn-ink: #7a5a00;
    --warn-soft: #faf2da;
    --crit: #c62828;
    --crit-ink: #a11f1f;
    --crit-soft: #fbe7e7;
    --shadow: 0 10px 40px rgba(0, 0, 0, 0.10);
    --radius: 0px;
    --font-ui: "Narkiss Block", "futura-pt", "Heebo", "Segoe UI", Arial, sans-serif;
    --font-display: "Narkiss Block", "futura-pt", "Heebo", Arial, sans-serif;
    --font-num: "futura-pt", "Narkiss Block", "Heebo", Arial, sans-serif;
    --go: #00ab4e; /* Pantone Green C — the GO that continues the wordmark */
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-ui);
    font-size: 15px;
    line-height: 1.5;
    font-synthesis: none;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: inherit; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
  a:hover { text-decoration-color: var(--ink-3); }
  strong, b { font-weight: 400; }
  :focus-visible { outline: 1px solid var(--ink); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }

  #app { direction: rtl; min-height: 100%; display: flex; flex-direction: column; }
  .logo { display: block; width: 196px; height: auto; aspect-ratio: 1306 / 162.4; color: var(--ink); }
  .logo-go { color: var(--go); } /* the GO drawn into the wordmark: same stroke as the logo, G touching the N, Pantone Green C */
  .logo use, .logo path { fill: currentColor; }

  /* ---------- masthead ---------- */
  .masthead {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
    background: var(--surface);
    border-bottom: 1px solid var(--rule);
  }
  .masthead-inner {
    max-width: 1480px; margin: 0 auto; padding-inline: 24px;
    display: flex; align-items: center; gap: 28px; flex-wrap: wrap; min-height: 64px;
  }
  .brand { display: inline-flex; align-items: baseline; padding: 12px 0; border: 0; background: none; min-width: 0; direction: ltr; }
  .brand .logo { width: 198px; }
  .brand:hover .logo { color: var(--ink-2); }
  .brand-office { display: none; }
  .brand-title { font-family: var(--font-display); font-weight: 200; font-size: 22px; line-height: 1.2; color: var(--ink); letter-spacing: .02em; }
  .nav { display: flex; gap: 4px; flex-wrap: wrap; margin-inline-start: auto; }
  .nav button {
    background: none; border: 0; border-bottom: 1px solid transparent;
    padding: 21px 10px 18px; color: var(--ink-2); font-weight: 400; letter-spacing: .04em; border-radius: 0; white-space: nowrap; line-height: 1.2;
  }
  .nav button:hover { color: var(--ink); }
  .nav button[aria-current="page"] { color: var(--ink); border-bottom-color: var(--ink); }
  .head-tools { display: flex; align-items: center; gap: 12px; }
  .sync { font-size: 12.5px; color: var(--ink-3); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; letter-spacing: .03em; }
  .sync-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--line-2); }
  .sync-dot.on { background: var(--good); }
  .sync-dot.err { background: var(--crit); }
  .sync-dot.saving { background: var(--warn); }
  .sync-dot.pending { background: var(--warn); box-shadow: 0 0 0 3px var(--warn-soft); }

  /* ---------- page ---------- */
  .page { flex: 1; width: 100%; max-width: 1480px; margin: 0 auto; padding-inline: 24px; padding-block: 28px 72px; }
  .view-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
  .view-title { font-family: var(--font-display); font-weight: 200; font-size: 36px; line-height: 1.1; margin: 0; letter-spacing: .01em; text-wrap: balance; }
  .view-sub { color: var(--ink-2); margin-top: 6px; }
  .view-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

  /* ---------- buttons ---------- */
  .btn {
    display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 0;
    border: 1px solid var(--ink); background: var(--surface); color: var(--ink); font-weight: 400; line-height: 1.2; letter-spacing: .03em;
    white-space: nowrap; transition: background-color .15s ease, color .15s ease, border-color .15s ease;
  }
  .btn:hover { background: var(--ink); color: var(--accent-ink); }
  .btn.primary { background: var(--ink); border-color: var(--ink); color: var(--accent-ink); }
  .btn.primary:hover { background: var(--accent-2); border-color: var(--accent-2); }
  .btn.danger { color: var(--crit-ink); border-color: var(--crit-soft); background: transparent; }
  .btn.danger:hover { background: var(--crit-soft); color: var(--crit-ink); }
  .btn.small { padding: 5px 11px; font-size: 13.5px; }
  .btn.ghost { border-color: transparent; background: transparent; color: var(--ink); padding-inline: 6px; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
  .btn.ghost:hover { background: transparent; color: var(--ink-2); }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .btn svg { width: 15px; height: 15px; }

  /* ---------- tiles ---------- */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin-bottom: 22px; }
  .tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px 14px; min-width: 0; text-align: start; display: flex; flex-direction: column; align-items: stretch; justify-content: flex-start; font: inherit; color: inherit; transition: border-color .15s ease; }
  .tile-label svg { width: 11px; height: 11px; flex: none; }
  .tile.clickable { cursor: pointer; }
  .tile.clickable:hover { border-color: var(--ink); }
  .tile-label { font-size: 13px; color: var(--ink-2); display: flex; align-items: center; gap: 6px; letter-spacing: .02em; }
  .tile-value { font-family: var(--font-num); font-weight: 300; font-size: 40px; line-height: 1; margin-top: 10px; letter-spacing: .02em; font-variant-numeric: tabular-nums; }
  .tile-sub { font-size: 12.5px; color: var(--ink-3); margin-top: 8px; }
  .tile.hero .tile-value { font-size: 54px; }
  .tile.crit .tile-value { color: var(--crit-ink); }
  .tile.warn .tile-value { color: var(--warn-ink); }

  /* ---------- panels ---------- */
  .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 12px; align-items: start; }
  .grid-2 > * { min-width: 0; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; min-width: 0; }
  .panel.span-2 { grid-column: 1 / -1; }
  .panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 14px; padding-bottom: 8px; border-bottom: 1px solid var(--rule); }
  .panel-title { font-weight: 400; font-size: 15px; margin: 0; letter-spacing: .05em; }
  .panel-sub { color: var(--ink-3); font-size: 12.5px; }
  .eyebrow { font-size: 11.5px; letter-spacing: .12em; color: var(--ink-3); font-weight: 400; }
  .empty { color: var(--ink-3); font-size: 13.5px; padding: 10px 0; }
  .empty .btn { margin-top: 8px; }

  /* ---------- bar list ---------- */
  .bars { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
  .bar-row { min-width: 0; display: grid; grid-template-columns: minmax(96px, 150px) 1fr auto; align-items: center; gap: 10px; min-height: 22px; }
  .bar-row.clickable { cursor: pointer; }
  .bar-row.clickable:hover .bar-label { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
  .bar-label { font-size: 13.5px; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-label small { color: var(--ink-3); }
  .bar-track { height: 8px; background: var(--surface-2); border-radius: 0; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--bar); border-radius: 0; min-width: 2px; transition: width .25s ease; }
  .bar-fill.muted { background: var(--bar-2); }
  .bar-fill.good { background: var(--good); }
  .bar-fill.warn { background: var(--warn); }
  .bar-fill.crit { background: var(--crit); }
  .bar-val { font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; min-width: 34px; text-align: start; }
  .bar-val strong { color: var(--ink); font-weight: 400; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-2); margin-top: 12px; }
  .legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 0; margin-inline-end: 6px; vertical-align: -1px; background: var(--bar); }
  .legend span.muted::before { background: var(--bar-2); }

  /* ---------- health / chips ---------- */
  .chip {
    display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 2px;
    font-size: 12.5px; font-weight: 400; border: 1px solid var(--line-2); background: transparent; color: var(--ink-2);
    white-space: nowrap; max-width: 100%; line-height: 1.4; letter-spacing: .02em;
  }
  .chip.btn-chip { cursor: pointer; }
  .chip.btn-chip:hover { border-color: var(--ink); color: var(--ink); }
  .chip.green { background: var(--good-soft); color: var(--good-ink); border-color: transparent; }
  .chip.yellow { background: var(--warn-soft); color: var(--warn-ink); border-color: transparent; }
  .chip.red { background: var(--crit-soft); color: var(--crit-ink); border-color: transparent; }
  .chip.accent { background: transparent; color: var(--ink); border-color: var(--ink); }
  .chip.dim { color: var(--ink-3); border-style: dashed; background: transparent; }
  .chip svg { width: 10px; height: 10px; flex: none; }
  .chip .x { margin-inline-start: 2px; border: 0; background: none; color: inherit; opacity: .6; padding: 0 2px; line-height: 1; border-radius: 0; }
  .chip .x:hover { opacity: 1; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips-sub { margin: -6px 0 14px; padding-top: 10px; border-top: 1px solid var(--line); }
  .chips-sub .chip { font-size: 12px; padding: 2px 8px; }
  .chips-sub .chip small, .chips .chip small { color: var(--ink-3); font-size: 11px; }
  .table-more { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 12px; border-top: 1px solid var(--line); font-size: 13px; }

  /* ---------- filters ---------- */
  .filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
  .filters .field { margin: 0; }
  .search { position: relative; flex: 1 1 220px; max-width: 360px; }
  .search input { padding-inline-start: 32px; }
  .search svg { position: absolute; inset-inline-start: 10px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--ink-3); }
  .filters select, .filters input { height: 36px; }
  .filters select { width: auto; max-width: 220px; }
  .filters .search input[type="search"] { padding-inline-start: 32px; }
  .count-note { color: var(--ink-3); font-size: 13px; margin-inline-start: auto; }

  /* ---------- forms ---------- */
  input[type="text"], input[type="number"], input[type="date"], input[type="search"], input[type="tel"], input[type="email"], input[type="password"], select, textarea {
    width: 100%; padding: 7px 10px; border: 1px solid var(--line-2); border-radius: 0; background: var(--surface); color: var(--ink);
    min-width: 0; transition: border-color .15s ease;
  }
  input:hover, select:hover, textarea:hover { border-color: var(--ink-2); }
  input:focus, select:focus, textarea:focus { border-color: var(--ink); outline: none; }
  textarea { resize: vertical; min-height: 64px; }
  select { appearance: auto; }
  .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; min-width: 0; }
  .field label { font-size: 12.5px; color: var(--ink-2); font-weight: 400; letter-spacing: .04em; }
  .field-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px 12px; }
  .inline-note { font-size: 12.5px; color: var(--ink-3); }
  .ltr { direction: ltr; unicode-bidi: isolate; display: inline-block; }
  .switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13.5px; }
  .switch input { width: auto; accent-color: #000; }
  input[type="checkbox"], input[type="radio"] { accent-color: #000; }

  /* ---------- table ---------- */
  .table-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 10px 12px; text-align: start; vertical-align: middle; border-bottom: 1px solid var(--line); }
  th { font-size: 12.5px; color: var(--ink-2); font-weight: 400; letter-spacing: .05em; white-space: nowrap; background: var(--surface); position: sticky; top: 0; border-bottom: 1px solid var(--rule); }
  th.sortable { cursor: pointer; user-select: none; }
  th.sortable:hover { color: var(--ink); }
  th .arrow { font-size: 10px; margin-inline-start: 3px; color: var(--ink); }
  tr:last-child td { border-bottom: 0; }
  tbody tr.row-click { cursor: pointer; }
  tbody tr.row-click:hover { background: var(--surface-2); }
  td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  td.col-main { min-width: 220px; }
  .cell-main { font-weight: 400; color: var(--ink); }
  .cell-sub { font-size: 12.5px; color: var(--ink-3); margin-top: 1px; }
  .cell-note { color: var(--ink-2); max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  td .chip { cursor: pointer; }
  .tag { font-size: 11px; padding: 1px 6px; border-radius: 2px; background: var(--warn-soft); color: var(--warn-ink); margin-inline-start: 6px; vertical-align: 1px; letter-spacing: .03em; }
  .tag.internal { background: transparent; color: var(--ink-3); border: 1px solid var(--line); }
  .stale { color: var(--warn-ink); }
  .never { color: var(--ink-3); }

  /* ---------- attention list ---------- */
  .list { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0; }
  .list-item { min-width: 0; display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
  .list-item:last-child { border-bottom: 0; }
  .list-item:hover .li-title { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
  .li-body { flex: 1; min-width: 0; }
  .li-title { font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .li-sub { font-size: 12.5px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .li-side { font-size: 12.5px; color: var(--ink-3); white-space: nowrap; }

  /* ---------- completeness ---------- */
  .todo-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
  .todo-card { border: 1px dashed var(--line-2); border-radius: 0; padding: 12px 14px; cursor: pointer; background: transparent; text-align: start; color: var(--ink); font: inherit; transition: border-color .15s ease; }
  .todo-card:hover { border-color: var(--ink); border-style: solid; }
  .todo-card strong { font-family: var(--font-num); font-size: 26px; font-weight: 300; display: block; line-height: 1.1; letter-spacing: .02em; }
  .todo-card span { font-size: 13px; color: var(--ink-2); }
  .todo-card.done { opacity: .45; cursor: default; }

  /* ---------- drawer ---------- */
  .scrim { position: fixed; inset: 0; background: rgba(255, 255, 255, 0.55); z-index: 30; }
  .drawer {
    position: fixed; top: 0; bottom: 0; inset-inline-end: 0; width: min(600px, 100%); z-index: 31;
    background: var(--surface); border-inline-start: 1px solid var(--rule); box-shadow: var(--shadow); display: flex; flex-direction: column;
    padding-top: env(safe-area-inset-top, 0px);
  }
  .drawer-head { display: flex; align-items: flex-start; gap: 10px; padding: 20px 24px 14px; border-bottom: 1px solid var(--rule); }
  .drawer-title { font-family: var(--font-display); font-weight: 400; font-size: 23px; line-height: 1.2; margin: 0; }
  .drawer-title input { font-family: var(--font-display); font-weight: 400; font-size: 23px; padding: 2px 6px; margin-inline-start: -6px; border-color: transparent; background: transparent; }
  .drawer-title input:hover, .drawer-title input:focus { border-color: var(--line-2); background: var(--surface); }
  .drawer-sub { color: var(--ink-3); font-size: 13px; margin-top: 4px; }
  .drawer-body { flex: 1; overflow-y: auto; padding: 18px 24px 40px; }
  .drawer-foot { border-top: 1px solid var(--line); padding: 10px 24px; display: flex; justify-content: space-between; gap: 8px; align-items: center; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }
  .icon-btn { border: 0; background: transparent; color: var(--ink-2); width: 32px; height: 32px; border-radius: 0; display: inline-flex; align-items: center; justify-content: center; flex: none; }
  .icon-btn:hover { background: var(--surface-2); color: var(--ink); }
  .icon-btn svg { width: 18px; height: 18px; }
  .section { margin-bottom: 24px; }
  .section-title { font-weight: 400; font-size: 13px; letter-spacing: .06em; margin: 0 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--rule); display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .section-title small { color: var(--ink-3); font-weight: 400; letter-spacing: 0; }
  .status-box { background: var(--surface-2); border: 1px solid transparent; border-radius: 0; padding: 12px; }
  .status-box textarea { background: var(--surface); }
  .status-meta { font-size: 12.5px; color: var(--ink-3); }
  .health-picker { display: flex; gap: 6px; flex-wrap: wrap; }
  .health-picker .chip { cursor: pointer; opacity: .5; }
  .health-picker .chip.on { opacity: 1; box-shadow: 0 0 0 1px currentColor; }
  .role-row { display: grid; grid-template-columns: 110px 1fr; gap: 8px; align-items: start; padding: 6px 0; border-bottom: 1px dashed var(--line); }
  .role-row:last-child { border-bottom: 0; }
  .role-name { font-size: 13px; color: var(--ink-2); padding-top: 4px; }
  .role-body { min-width: 0; }
  .linked { display: grid; gap: 4px; }
  .linked a { text-decoration: none; }
  .linked a:hover { text-decoration: underline; }
  .comm-row { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px dashed var(--line); font-size: 13.5px; }
  .comm-row:last-child { border-bottom: 0; }
  /* contract milestones (work list) */
  .ms-list { display: grid; gap: 6px; margin-top: 8px; }
  .ms-group { font-size: 12px; color: var(--ink-2); letter-spacing: .03em; padding: 10px 0 2px; }
  .msr { border: 1px solid var(--line); background: var(--surface); }
  .msr.open { border-color: var(--line-2); }
  .msr-head { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 8px; align-items: center; padding: 7px 10px; }
  .msr-name { cursor: pointer; min-width: 0; }
  .msr-name small { display: block; color: var(--ink-3); font-size: 11.5px; }
  .msr.done .msr-name { color: var(--ink-3); text-decoration: line-through; }
  .msr-meta { display: inline-flex; gap: 10px; font-size: 12.5px; color: var(--ink-3); white-space: nowrap; }
  .msr-caret { width: 26px; height: 26px; }
  .msr-body { border-top: 1px dashed var(--line); padding: 10px 12px 12px; background: var(--surface-2); }
  .msr-body .task-item { padding: 6px 0; }
  @media (max-width: 720px) { .msr-meta { display: none; } }
  /* milestone types (settings) */
  .mt-head, .mt-row { display: grid; grid-template-columns: minmax(180px, 1.4fr) 150px 60px minmax(160px, 1.6fr) auto; gap: 10px; align-items: center; padding: 6px 0; border-bottom: 1px dashed var(--line); }
  .mt-head { font-size: 11.5px; color: var(--ink-3); letter-spacing: .05em; border-bottom: 1px solid var(--rule); }
  .mt-row:last-child { border-bottom: 0; }
  .mt-aliases { font-size: 12px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  @media (max-width: 720px) { .mt-head { display: none; } .mt-row { grid-template-columns: 1fr 1fr; } .mt-aliases { grid-column: 1 / -1; white-space: normal; } }

  /* ---------- popover menu ---------- */
  .menu {
    position: fixed; z-index: 40; background: var(--surface); border: 1px solid var(--ink); border-radius: 0; box-shadow: var(--shadow);
    min-width: 200px; max-width: min(360px, calc(100vw - 24px)); max-height: min(420px, 70vh); display: flex; flex-direction: column; overflow: hidden;
    direction: rtl;
  }
  .menu-search { padding: 8px; border-bottom: 1px solid var(--line); }
  .menu-list { overflow-y: auto; padding: 4px; }
  .menu-item { display: flex; align-items: center; gap: 8px; width: 100%; padding: 7px 10px; border: 0; background: none; text-align: start; border-radius: 0; color: var(--ink); }
  .menu-item:hover, .menu-item.active { background: var(--surface-2); }
  .menu-item.selected { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
  .menu-item.create { color: var(--ink); border-top: 1px solid var(--line); border-radius: 0; margin-top: 4px; padding-top: 9px; }
  .menu-item small { color: var(--ink-3); margin-inline-start: auto; font-size: 12.5px; }
  .menu-empty { padding: 10px; color: var(--ink-3); font-size: 13.5px; }

  /* ---------- settings ---------- */
  .set-list { display: grid; gap: 6px; }
  .set-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
  .set-row.with-weight { grid-template-columns: 1fr 90px auto; }
  .set-row.team { grid-template-columns: 1fr 1fr auto; }
  .set-row input[type="number"] { text-align: center; }
  .set-tools { display: flex; gap: 2px; }
  .add-row { display: flex; gap: 8px; margin-top: 10px; }
  .add-row input { flex: 1; }

  /* ---------- teams ---------- */
  .team-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 12px; align-items: start; }
  .team-card .panel-head { align-items: center; flex-wrap: wrap; }
  .team-name { flex: 1; min-width: 160px; }
  .team-name input { font-weight: 400; font-size: 17px; border-color: transparent; background: transparent; padding: 4px 6px; margin-inline-start: -6px; }
  .team-name input:hover, .team-name input:focus { border-color: var(--line-2); background: var(--surface); }
  .team-stats { display: flex; gap: 12px; font-size: 13px; color: var(--ink-2); flex-wrap: wrap; }
  .team-lead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 10px; background: var(--surface-2); border-radius: 0; margin-bottom: 8px; }
  .member-list { display: grid; }
  .member-list.wide { grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); column-gap: 32px; }
  .member-row { display: grid; grid-template-columns: 1fr 170px auto; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px dashed var(--line); }
  .member-row:last-child { border-bottom: 0; }
  .member-row input { height: 32px; font-size: 13.5px; }
  .member-name { font-weight: 400; }
  .member-name:hover { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
  .member-sub { font-size: 12.5px; color: var(--ink-3); }
  .team-lead .member-sub { flex-basis: 100%; }
  /* ---------- experience levels & load matrix (team leads and up) ---------- */
  .lvl { color: var(--ink-2); }
  .lvl.manual { color: var(--ink); border-bottom: 1px solid var(--ink); }
  .util.good { color: var(--good-ink); }
  .util.warn { color: var(--warn-ink); }
  .util.crit { color: var(--crit-ink); font-weight: 500; }
  .matrix th.num, .matrix td.num { text-align: end; }
  .matrix tbody tr.clickable { cursor: pointer; }
  .matrix tbody tr.clickable:hover { background: var(--surface-2); }
  .matrix tbody tr.muted td { color: var(--ink-3); }
  .matrix tfoot td { border-top: 1px solid var(--rule); border-bottom: 0; font-weight: 500; background: var(--surface); }
  .matrix small.muted { color: var(--ink-3); font-weight: 400; margin-inline-start: 6px; }
  .util-bar { display: inline-block; width: 64px; height: 4px; background: var(--surface-2); vertical-align: middle; margin-inline-end: 8px; overflow: hidden; }
  .util-bar > div { height: 100%; background: var(--ink); }
  .util-bar > div.good { background: var(--good); }
  .util-bar > div.warn { background: var(--warn); }
  .util-bar > div.crit { background: var(--crit); }
  .lvl-summary { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 13px; margin: 4px 0 8px; }
  @media (max-width: 720px) { .util-bar { display: none; } }
  /* ---------- project phases ---------- */
  .phase-list { display: grid; gap: 4px; }
  .phase-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 8px; align-items: center; }
  .phase-row input { height: 32px; font-size: 14px; }
  .phase-state { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line-2); background: var(--surface); display: inline-flex; align-items: center; justify-content: center; color: var(--ink-3); padding: 0; }
  .phase-state svg { width: 18px; height: 18px; }
  .phase-state:hover { border-color: var(--ink); color: var(--ink); }
  .phase-row.active .phase-state { border-color: var(--ink); color: var(--ink); background: var(--surface); }
  .phase-row.active input { border-color: var(--ink); }
  .phase-row.done .phase-state { border-color: var(--good); color: var(--good); background: var(--good-soft); }
  .phase-row.done input { color: var(--ink-3); text-decoration: line-through; }
  .phase-status-label { font-size: 12.5px; color: var(--ink-3); white-space: nowrap; min-width: 62px; }
  .ph-why { font-size: 11.5px; color: var(--ink-3); }
  .ph-why.warn { color: var(--warn-ink); }
  .ph-why.dim { color: var(--ink-3); opacity: .8; }
  .fit-note { margin-bottom: 8px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; border-inline-start: 2px solid var(--warn); padding-inline-start: 8px; }
  .ptm th.num, .ptm td.num { text-align: center; }
  .ptm td.num input { width: 16px; height: 16px; margin: 0; }
  .ptm small.muted { color: var(--ink-3); font-weight: 400; margin-inline-start: 6px; }
  .progress { height: 4px; background: var(--surface-2); border-radius: 0; overflow: hidden; margin: 2px 0 12px; }
  .progress > div { height: 100%; background: var(--ink); border-radius: 0; transition: width .25s ease; }
  @media (max-width: 720px) {
    .member-list.wide { grid-template-columns: minmax(0, 1fr); }
    .member-row { grid-template-columns: minmax(0, 1fr) auto; }
    .member-row input { grid-column: 1 / -1; }
    .phase-status-label { display: none; }
  }

  /* ---------- tasks ---------- */
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--rule); margin-bottom: 18px; overflow-x: auto; }
  .tabs button { background: none; border: 0; border-bottom: 1px solid transparent; margin-bottom: -1px; padding: 8px 14px 10px; color: var(--ink-2); font-weight: 400; letter-spacing: .04em; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; border-radius: 0; }
  .tabs button:hover { color: var(--ink); }
  .tabs button.on { color: var(--ink); border-bottom-color: var(--ink); }
  .tab-badge { background: var(--crit); color: #fff; font-size: 11px; border-radius: 0; padding: 0 6px; line-height: 16px; }
  .task-group { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 16px; margin-bottom: 10px; }
  .task-group-head { display: flex; align-items: baseline; gap: 8px; font-weight: 400; letter-spacing: .05em; margin-bottom: 2px; }
  .task-group-head small { color: var(--ink-3); font-weight: 400; letter-spacing: 0; }
  .task-group.crit .task-group-head { color: var(--crit-ink); }
  .task-group.warn .task-group-head { color: var(--warn-ink); }
  .task-item { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); cursor: pointer; min-width: 0; }
  .task-item:last-child { border-bottom: 0; }
  .task-item:hover .li-title { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
  .task-item.is-done .li-title { text-decoration: line-through; color: var(--ink-3); }
  .task-check { width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--line-2); background: transparent; flex: none; display: inline-flex; align-items: center; justify-content: center; padding: 0; color: #fff; }
  .task-check:hover { border-color: var(--ink); }
  .task-check.done { background: var(--ink); border-color: var(--ink); }
  .task-check.in_progress { border-color: var(--ink); border-width: 2px; }
  .task-check.waiting { border-color: var(--warn); border-style: dashed; }
  .task-check svg { width: 14px; height: 14px; }
  .prio { color: var(--crit); display: inline-flex; margin-inline-end: 4px; vertical-align: -2px; }
  .prio svg { width: 12px; height: 12px; }
  .due { font-size: 12.5px; color: var(--ink-3); white-space: nowrap; }
  .due.crit { color: var(--crit-ink); }
  .due.warn { color: var(--warn-ink); }
  .li-side { display: inline-flex; align-items: center; gap: 8px; }
  .li-side .status-chip { font-size: 11px; padding: 1px 7px; }
  .task-details { margin: 6px 0 10px; }
  .task-details summary { cursor: pointer; color: var(--ink-2); font-weight: 400; padding: 6px 0; letter-spacing: .03em; }
  .task-details summary small { color: var(--ink-3); }
  .task-quick { margin-bottom: 14px; }
  .task-quick input { flex: 1; }
  .board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; align-items: start; }
  .board-col { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; min-width: 0; }
  .board-col.done { opacity: .8; }
  .board-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; padding-bottom: 8px; border-bottom: 1px solid var(--rule); }
  .board-head small { color: var(--ink-3); }
  .board-empty { color: var(--line-2); text-align: center; padding: 12px 0; }
  .status-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .status-row .chip { cursor: pointer; }
  .status-row .chip.on { background: var(--ink); color: #fff; border-color: var(--ink); box-shadow: none; }
  .status-row .chip.red.on { background: var(--crit); border-color: var(--crit); color: #fff; }
  .checklist { display: grid; gap: 2px; margin-bottom: 8px; }
  .check-row { display: flex; align-items: center; gap: 6px; }
  .check-row label { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; cursor: pointer; padding: 4px 0; }
  .check-row input { width: auto; }
  .check-row.done span { text-decoration: line-through; color: var(--ink-3); }
  .comments { display: grid; gap: 8px; margin-bottom: 12px; }
  .comment { background: var(--surface-2); border-radius: 0; padding: 9px 12px; }
  .comment-head { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-3); }
  .comment-who { font-weight: 400; color: var(--ink); }
  .comment-head .icon-btn { margin-inline-start: auto; }
  .comment-body { margin-top: 3px; overflow-wrap: anywhere; }
  .comment.system { background: transparent; padding: 2px 12px; font-size: 13px; color: var(--ink-3); }
  .comment.system time { margin-inline-start: 6px; }
  .mention { color: var(--ink); background: var(--accent-soft); padding: 0 3px; }
  .composer textarea { width: 100%; }
  .composer-tools { display: flex; justify-content: space-between; gap: 8px; margin-top: 6px; }
  .bell { position: relative; display: inline-flex; }
  .bell-btn { background: none; border: 1px solid transparent; border-radius: 0; width: 34px; height: 34px; display: inline-flex; align-items: center; justify-content: center; color: var(--ink-2); position: relative; padding: 0; }
  .bell-btn:hover, .bell-btn.has { color: var(--ink); }
  .bell-btn svg { width: 20px; height: 20px; }
  .bell-count { position: absolute; top: 1px; inset-inline-end: 0; background: var(--crit); color: #fff; font-size: 10.5px; min-width: 16px; height: 16px; border-radius: 0; padding: 0 4px; display: inline-flex; align-items: center; justify-content: center; font-weight: 400; }
  .bell-pop { position: absolute; top: 40px; inset-inline-end: 0; width: min(380px, calc(100vw - 24px)); background: var(--surface); border: 1px solid var(--ink); border-radius: 0; box-shadow: var(--shadow); z-index: 35; direction: rtl; text-align: start; }
  .bell-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-bottom: 1px solid var(--rule); letter-spacing: .04em; }
  .bell-list { max-height: min(420px, 70vh); overflow-y: auto; }
  .notif { display: flex; flex-direction: column; gap: 2px; padding: 10px 14px; border-bottom: 1px solid var(--line); cursor: pointer; font-size: 14px; }
  .notif:last-child { border-bottom: 0; }
  .notif:hover { background: var(--surface-2); }
  .notif.unread { background: var(--accent-soft); }
  .notif time { font-size: 12px; color: var(--ink-3); }
  .notif-task { font-weight: 400; }
  @media (max-width: 900px) { .board { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 560px) { .board { grid-template-columns: 1fr; } }

  /* ---------- auth ---------- */
  .auth-wrap { min-height: calc(100vh - 40px); display: flex; align-items: center; justify-content: center; padding: 20px 0; }
  .auth-card { width: min(440px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 0; padding: 40px 36px 32px; }
  .auth-brand { margin-bottom: 28px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
  .auth-brand .logo { width: min(392px, 84%); }
  .auth-brand .brand-office { display: block; font-size: 12.5px; letter-spacing: .14em; color: var(--ink-2); }
  .auth-brand .brand-row { display: flex; align-items: baseline; justify-content: center; direction: ltr; width: 100%; }
  .auth-brand .brand-title { font-size: 20px; }
  .auth-title { font-family: var(--font-display); font-weight: 400; font-size: 20px; margin: 0 0 8px; letter-spacing: .02em; }
  .auth-tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--rule); margin-bottom: 18px; }
  .auth-tabs button { background: none; border: 0; border-bottom: 1px solid transparent; margin-bottom: -1px; padding: 8px 12px 10px; color: var(--ink-2); font-weight: 400; letter-spacing: .04em; }
  .auth-tabs button.on { color: var(--ink); border-bottom-color: var(--ink); }
  .auth-form { display: flex; flex-direction: column; gap: 4px; }
  .auth-form .btn.primary { margin-top: 6px; justify-content: center; }
  .auth-form .btn.ghost { align-self: flex-start; margin-top: 4px; }
  .user-name { font-size: 13.5px; color: var(--ink-2); max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #user-box { display: inline-flex; align-items: center; gap: 8px; }
  .row-inactive .cell-main { color: var(--ink-3); }
  .row-pending { background: var(--warn-soft); }
  .steps { margin: 0; padding-inline-start: 18px; color: var(--ink-2); font-size: 14px; display: grid; gap: 6px; }
  .modal { position: fixed; z-index: 46; inset-inline: 0; top: 18vh; margin: 0 auto; width: min(460px, calc(100% - 32px)); background: var(--surface); border: 1px solid var(--ink); border-radius: 0; padding: 22px 24px; box-shadow: var(--shadow); direction: rtl; }
  .audit { display: grid; gap: 0; max-height: 520px; overflow-y: auto; }
  .audit-row { display: grid; grid-template-columns: 92px 1fr; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .audit-row:last-child { border-bottom: 0; }
  .audit-when { color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .audit-who { font-weight: 400; }
  .audit-what { color: var(--ink); }
  .audit-diff { color: var(--ink-3); margin-top: 2px; overflow-wrap: anywhere; }

  /* ---------- field: visits, items, photos ---------- */
  .visit-ic { width: 22px; height: 22px; flex: none; color: var(--ink-2); display: inline-flex; }
  .visit-ic svg { width: 20px; height: 20px; }
  .vi-list { display: grid; gap: 10px; }
  .vi-row { border: 1px solid var(--line); padding: 10px 12px; background: var(--surface); }
  .vi-row.closed { opacity: .72; }
  .vi-row.closed .vi-body { text-decoration: line-through; color: var(--ink-3); }
  .vi-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
  .vi-no { font-family: var(--font-num); font-variant-numeric: tabular-nums; color: var(--ink-2); min-width: 34px; }
  .vi-loc { flex: 1; min-width: 140px; }
  .vi-body { width: 100%; resize: vertical; }
  .vi-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 6px; font-size: 13px; }
  .vi-due { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-3); font-size: 12.5px; }
  .vi-due input { width: auto; padding: 4px 6px; font-size: 13px; }
  .vi-carried { display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--line); }
  .vi-carried:last-child { border-bottom: 0; }
  .ph-strip { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
  .ph-strip.small { gap: 6px; }
  .ph { position: relative; width: 96px; height: 96px; margin: 0; border: 1px solid var(--line); background: var(--surface-2); overflow: hidden; cursor: pointer; }
  .ph-strip.small .ph, .ph-strip.small .ph-add { width: 72px; height: 72px; }
  .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ph-wait, .ph-file { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; color: var(--ink-3); gap: 4px; font-size: 11px; }
  .ph-file svg { width: 22px; height: 22px; }
  .ph-del { position: absolute; top: 2px; inset-inline-end: 2px; width: 22px; height: 22px; border: 0; background: rgba(255,255,255,.9); color: var(--ink); display: inline-flex; align-items: center; justify-content: center; padding: 0; opacity: 0; transition: opacity .15s ease; }
  .ph:hover .ph-del, .ph:focus-within .ph-del { opacity: 1; }
  @media (hover: none) { .ph-del { opacity: 1; } }
  .ph-del svg { width: 12px; height: 12px; }
  .ph-add { width: 96px; height: 96px; border: 1px dashed var(--line-2); display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--ink-2); cursor: pointer; font-size: 12px; text-align: center; padding: 4px; }
  .ph-add:hover { border-color: var(--ink); color: var(--ink); }
  .ph-add svg { width: 22px; height: 22px; }
  .rec-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 12px; align-items: center; padding: 8px 0; border-bottom: 1px dashed var(--line); }
  .rec-row:last-of-type { border-bottom: 0; }
  .rec-main { min-width: 0; }
  .rec-main audio { width: 100%; max-width: 420px; height: 34px; display: block; }
  .rec-side { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .rec-transcript { grid-column: 1 / -1; font-size: 13px; }
  .rec-transcript summary { cursor: pointer; color: var(--ink-2); }
  .rec-transcript pre { white-space: pre-wrap; font: inherit; background: var(--surface-2); padding: 10px 12px; max-height: 320px; overflow-y: auto; margin: 6px 0 0; }
  .rec-timer { font-family: var(--font-num); font-variant-numeric: tabular-nums; margin-inline-start: 6px; }
  .crit-text { color: var(--crit-ink); font-size: 12.5px; }
  .chip.red { background: var(--crit-soft); color: var(--crit-ink); border-color: transparent; }
  .lightbox { position: fixed; inset: 0; z-index: 48; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 24px; cursor: zoom-out; }
  .lightbox img { max-width: 100%; max-height: calc(100% - 40px); object-fit: contain; box-shadow: var(--shadow); background: #fff; }
  .lightbox-cap { color: #fff; font-size: 13px; text-align: center; }

  /* ---------- report (screen + PDF pages) ---------- */
  .rp-tools { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
  .rp-note { font-size: 12.5px; color: var(--ink-3); margin-bottom: 16px; }
  .rp-doc { width: 794px; padding: 0 56px; box-sizing: border-box; background: #fff; }  /* measured at A4 width even on phones */
  .rp-pages { display: grid; gap: 18px; justify-content: center; }
  .rp-page { width: 794px; max-width: 100%; min-height: 1123px; background: #fff; border: 1px solid var(--line); box-shadow: 0 6px 30px rgba(0,0,0,.08); position: relative; direction: rtl; box-sizing: border-box; padding: 56px 56px 44px; display: flex; flex-direction: column; }
  .rp-page-in { flex: 1; }
  .rp-pagefoot { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--ink-3); border-top: 1px solid var(--line); padding-top: 6px; margin-top: 12px; letter-spacing: .04em; }
  .rp-b { margin-bottom: 8px; font-size: 13px; line-height: 1.45; }
  .rp-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; border-bottom: 1px solid var(--rule); padding-bottom: 12px; margin-bottom: 12px; }
  .rp-brand { display: flex; align-items: baseline; direction: ltr; }
  .rp-brand .logo { width: 196px; }
  .rp-titles { text-align: start; }
  .rp-title { font-family: var(--font-display); font-weight: 200; font-size: 26px; line-height: 1.1; letter-spacing: .01em; }
  .rp-title span { color: var(--ink-2); }
  .rp-project { font-size: 15px; margin-top: 4px; }

/* per-project phases: p.phases = [{id, name, weight, state: todo|active|done}]; a project without the array uses the template for its type.
   Which template phases apply is decided by the project type (settings.phasesByType; by default a permit phase exists only for
   private houses and residential neighbourhoods) and by the contract: a phase that has milestones in the contract is always in. */
const PERMIT_TYPES = ['בית פרטי', 'מגורים', 'התחדשות עירונית']; // types whose contracts usually include a permit; per project the contract decides
const TYPE_ONLY_PHASES = { permit: PERMIT_TYPES }; // default rule: phase id → the only types that get it
function phaseIdsForType(type) {
  const tpl = settings().phases; const map = settings().phasesByType || {};
  if (type && Array.isArray(map[type])) return tpl.filter((x) => map[type].includes(x.id)).map((x) => x.id);
  return tpl.filter((x) => !TYPE_ONLY_PHASES[x.id] || !type || TYPE_ONLY_PHASES[x.id].includes(type)).map((x) => x.id);
}
const phasesForType = (type) => { const ids = phaseIdsForType(type); return settings().phases.filter((x) => ids.includes(x.id)); };
/* phases the contract asks for: the phase of every milestone type used by the project's milestones (loaded per project) */
function contractPhases(pid) {
  const out = new Set();
  Object.values(S.project_milestones).forEach((m) => { if (m.projectId !== pid) return; const ph = (m.typeId && S.milestone_types[m.typeId]?.phase) || m.phase; if (ph) out.add(ph); });
  return [...out];
}
const contractPhaseCount = (pid, phaseId) => Object.values(S.project_milestones).filter((m) => m.projectId === pid && (((m.typeId && S.milestone_types[m.typeId]?.phase) || m.phase) === phaseId)).length;
function projectPhases(p) {
  if (Array.isArray(p.phases)) return p.phases;
  const tpl = phasesForType(p.type);
  const idx = p.phase ? tpl.findIndex((x) => x.id === p.phase) : -1;
  return tpl.map((x, i) => ({ id: x.id, name: x.name, weight: x.weight, state: idx < 0 ? 'todo' : i < idx ? 'done' : i === idx ? 'active' : 'todo' }));
}
/* the phase list a project should have: its type's template ∪ the contract's phases; existing states, names and custom phases are kept,
   a template phase that neither the type nor the contract needs is dropped, missing ones are added in template order */
function fitPhases(p) {
  const tpl = settings().phases; const order = new Map(tpl.map((t, i) => [t.id, i]));
  const want = new Set(phaseIdsForType(p.type)); contractPhases(p.id).forEach((id) => want.add(id));
  const cur = projectPhases(p);
  const out = cur.filter((x) => want.has(x.id) || !order.has(x.id));
  tpl.forEach((t) => {
    if (!want.has(t.id) || out.some((x) => x.id === t.id)) return;
    const item = { id: t.id, name: t.name, weight: t.weight, state: 'todo' };
    let at = 0;
    for (let i = 0; i < out.length; i++) { const oi = order.get(out[i].id); if (oi != null && oi < order.get(t.id)) at = i + 1; }
    out.splice(at, 0, item);

}
const phasesUntouched = (p) => projectPhases(p).every((x) => x.state === 'todo');
const samePhaseIds = (a, b) => a.length === b.length && a.every((x, i) => x.id === b[i].id);

const allPhasesDone = (p) => { const ph = projectPhases(p); return ph.length > 0 && ph.every((x) => x.state === 'done'); };
const phaseLabel = (p) => { const a = activePhases(p); if (a.length) return a.map((x) => x.name).join(' + '); return allPhasesDone(p) ? 'כל השלבים הושלמו' : 'ללא שלב פעיל'; };

const isStale = (p) => { const d = daysSince(p.statusUpdatedAt); return d == null || d > (settings().staleDays || 14); };
/* ===================== experience levels & capacity (team leads and up) =====================
   level per employee: 0.5 up to 6 months in the office, 0.75 up to a year, 1 from a year, 1.25 from 3 years, 1.5 from 5 years;
   a manual value (0–2) overrides the calculation. team capacity = Σ levels × load points per level (settings.loadPerLevel). */
const LEVEL_MAX = 2;
const LEVEL_STEPS = [{ months: 6, level: 0.5, label: 'עד חצי שנה' }, { months: 12, level: 0.75, label: 'עד שנה' }, { months: 36, level: 1, label: 'משנה' }, { months: 60, level: 1.25, label: 'מ-3 שנים' }, { months: Infinity, level: 1.5, label: 'מ-5 שנים' }];
const canSeeLevels = () => ['owner', 'manager', 'team_lead'].includes(myRole());
const myContactId = () => me()?.contactId || null;
const canEditLevel = (c) => !!c && c.type === 'employee' && (isManager() || (myRole() === 'team_lead' && !!c.teamId && T().some((t) => t.id === c.teamId && t.leadId === myContactId())));
const tenureMonths = (startDate) => { if (!startDate) return null; const d = new Date(startDate); if (isNaN(d)) return null; return Math.max(0, (Date.now() - d.getTime()) / (365.25 * 86400000 / 12)); };
const autoLevel = (startDate) => { const m = tenureMonths(startDate); if (m == null) return 1; return LEVEL_STEPS.find((s) => m < s.months).level; };
const levelRow = (cid) => S.employee_levels[cid] || null;
const manualLevel = (c) => { const r = levelRow(c.id); return r && r.level != null && r.level !== '' ? Math.min(LEVEL_MAX, Math.max(0, Number(r.level))) : null; };
const empLevel = (c) => { const m = manualLevel(c); return m != null ? m : autoLevel(c.startDate); };
const tenureLabel = (startDate) => {
  const m = tenureMonths(startDate); if (m == null) return 'ללא תאריך תחילת עבודה';
  const y = Math.floor(m / 12), mo = Math.floor(m % 12);
  if (y === 0) return mo <= 1 ? 'חודש' : `${mo} חודשים`;
  const ys = y === 1 ? 'שנה' : y === 2 ? 'שנתיים' : `${y} שנים`;
  return mo ? `${ys} ו-${mo === 1 ? 'חודש' : mo + ' חודשים'}` : ys;
};
const loadPerLevel = () => Number(settings().loadPerLevel) || 4;
/* a team lead runs the team, so only part of their position (25% by default) counts towards project capacity */
const leadShare = () => { const v = settings().leadCapacityShare; const n = Number(v); return v == null || v === '' || isNaN(n) ? 0.25 : Math.min(1, Math.max(0, n)); };
const isTeamLead = (cid) => !!cid && T().some((t) => t.leadId === cid);
const capacityLevel = (c) => empLevel(c) * (isTeamLead(c.id) ? leadShare() : 1);
const teamMembers = (tid) => employees().filter((e) => e.teamId === tid);
const teamCapacity = (tid) => sum(teamMembers(tid), capacityLevel);
/* a project's load is shared equally by the people assigned to it (lead + members); with nobody assigned it stays with the team */
function personalLoads(act) {
  const m = {};
  act.forEach((p) => {
    const people = [...new Set([p.leadId, ...(p.memberIds || [])].filter((x) => x && S.contacts[x]))];
    if (!people.length) return;
    const share = projectWeight(p) / people.length;
    people.forEach((id) => { m[id] = (m[id] || 0) + share; });
  });
  return m;
}

function utilInfo(load, levels) {

  const bo = document.getElementById('brand-office'); if (bo) bo.textContent = settings().officeName || 'OBERSON';
  if (S.auth.status !== 'loading' && (S.auth.status !== 'ready' || S.dbState !== 'connecting')) bootDone();
  if (!signedIn) { page.innerHTML = renderAuth(); renderBell(); renderOverlay(); restoreFocus(focus); return; }

  renderUserBox();

  if (S.ui.view !== 'report' && !visibleViews().some((v) => v.id === S.ui.view)) S.ui.view = 'overview';
  document.body.classList.toggle('report-view', S.ui.view === 'report');

  else if (S.dbState === 'connecting') page.innerHTML = '<div class="loading">טוען את נתוני המשרד…</div>';

/* every render rebuilds the page and the drawer from scratch — keep the person's place: the drawer's scroll position (as long as it is the

const drawerKey = () => (S.ui.drawer ? S.ui.drawer.kind + ':' + S.ui.drawer.id : null);

  const el = document.activeElement;

  const f = { id: el && el.id && el !== document.body ? el.id : null, start: el?.selectionStart, end: el?.selectionEnd, scroll: body ? body.scrollTop : null, drawer: drawerKey(), page: window.scrollY };
  return f;

  if (body && f.scroll != null && f.drawer === drawerKey()) body.scrollTop = f.scroll;
  if (f.page != null && f.page > 0 && Math.abs(window.scrollY - f.page) > 1) window.scrollTo({ top: f.page });
  if (!f.id) return;
  const el = document.getElementById(f.id);
  if (!el) return;
  el.focus({ preventScroll: true });

function visibleProjects() {
  const f = S.ui.filters; const q = norm(f.q);
  let ps = P().filter((p) => {
    if (f.state && p.state !== f.state) return false;
    if (f.team && p.teamId !== f.team) return false;
    if (f.lead && p.leadId !== f.lead) return false;
    if (f.phase && (f.phase === 'none' ? !!activePhases(p).length : f.phase === '__done' ? !allPhasesDone(p) : !hasActivePhaseNamed(p, f.phase))) return false;
    if (f.health && (f.health === 'none' ? !!p.health : p.health !== f.health)) return false;
    if (f.type && p.type !== f.type) return false;
    if (f.flag === 'noPhase' && (activePhases(p).length || allPhasesDone(p))) return false;
    if (f.flag === 'noTeam' && p.teamId) return false;
    if (f.flag === 'noLead' && p.leadId) return false;
    if (f.flag === 'review' && !p.needsReview) return false;
    if (f.flag === 'stale' && !isStale(p)) return false;
    if (q) {
      const hay = norm([p.name, p.number, p.city, p.address, p.type, p.typeDetail, cname(p.clientId, ''), cname(p.leadId, ''), tname(p.teamId, ''), p.statusNote].join(' '));
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  const { key, dir } = S.ui.sort;
  const val = (p) => ({
    name: projectDisplayName(p) || '', client: cname(p.clientId, ''), team: tname(p.teamId, 'תתת'), lead: cname(p.leadId, 'תתת'),
    phase: (() => { const a = activePhases(p); if (!a.length) return allPhasesDone(p) ? 98 : 99; const i = settings().phases.findIndex((x) => x.name === a[0].name); return i < 0 ? 50 : i; })(), health: { red: 0, yellow: 1, green: 2 }[p.health] ?? 3,
    updated: p.statusUpdatedAt || '', start: p.startDate || '',
  })[key];
  ps.sort((a, b) => { const x = val(a), y = val(b); const r = typeof x === 'number' ? x - y : String(x).localeCompare(String(y), 'he'); return r * dir; });
  return ps;
}

const CONTACT_PAGE = 250; // rows rendered before "show more" — keeps the person registry (1000+ rows) snappy
const NO_CAT = '__none';
/* one pass over the active projects → { contactId: activeProjectCount } (instead of scanning all projects per row) */
function activeProjectCounts() {
  const m = {};
  const add = (id) => { if (id) m[id] = (m[id] || 0) + 1; };
  activeProjects().forEach((p) => {
    const seen = new Set();
    const hit = (id) => { if (id && !seen.has(id)) { seen.add(id); add(id); } };
    hit(p.clientId); (p.clientPersonIds || []).forEach(hit);
    ROLES.forEach((r) => r.single ? hit(p[r.field]) : (p[r.field] || []).forEach(hit));
  });
  return m;
}
/* category facet of a contact for the chips row: registry category for suppliers/consultants/partners, parent type for people */
function contactFacet(tab, c) {
  if (CAT_LIST[tab]) return c.category || NO_CAT;
  if (tab === 'person') return (c.parentId && S.contacts[c.parentId]) ? S.contacts[c.parentId].type : NO_CAT;
  return '';
}
function facetLabel(tab, key) {
  if (key === NO_CAT) return CAT_LIST[tab] ? 'ללא תחום' : 'ללא שיוך';
  if (tab === 'person') return CTYPES[key]?.plural || key;
  return key;
}
function facetChips(tab, pool) {
  if (!CAT_LIST[tab] && tab !== 'person') return '';
  const counts = {};
  pool.forEach((c) => { const k = contactFacet(tab, c); counts[k] = (counts[k] || 0) + 1; });
  const ordered = CAT_LIST[tab] ? (settings()[CAT_LIST[tab]] || []).slice() : ORG_TYPES.slice();
  Object.keys(counts).forEach((k) => { if (k !== NO_CAT && !ordered.includes(k)) ordered.push(k); });
  const keys = ordered.filter((k) => counts[k]).concat(counts[NO_CAT] ? [NO_CAT] : []);
  if (keys.length < 2) return '';
  const cur = S.ui.ccat;
  const chip = (k, label, n) => `<span class="chip btn-chip ${cur === k ? 'accent' : ''}" data-action="ccat" data-cat="${esc(k)}" role="button" tabindex="0">${esc(label)} <small>${n}</small></span>`;
  return `<div class="chips chips-sub" aria-label="${CAT_LIST[tab] ? 'סינון לפי תחום' : 'סינון לפי סוג הארגון'}">${chip('', 'הכל', pool.length)}${keys.map((k) => chip(k, facetLabel(tab, k), counts[k])).join('')}</div>`;
}

const addDays = (ymd, n) => { const d = new Date(ymd + 'T00:00:00'); d.setDate(d.getDate() + n); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };

function dueInfo(t) {
  if (!t.dueDate) return { key: 'none', cls: '', label: '' };
  const d = String(t.dueDate).slice(0, 10);
  if (t.status === 'done') return { key: 'done', cls: '', label: fmtDate(d) };
  const diff = Math.round((new Date(d + 'T00:00:00') - new Date(todayStr() + 'T00:00:00')) / 86400000);
  if (diff < 0) return { key: 'overdue', cls: 'crit', label: diff === -1 ? 'אתמול' : `באיחור ${-diff} ימים` };
  if (diff === 0) return { key: 'today', cls: 'warn', label: 'היום' };
  if (diff === 1) return { key: 'week', cls: '', label: 'מחר' };
  if (diff <= 7) return { key: 'week', cls: '', label: `בעוד ${diff} ימים` };
  return { key: 'later', cls: '', label: fmtDate(d) };
}
const isOverdue = (t) => isOpenTask(t) && dueInfo(t).key === 'overdue';
function sortTasks(arr) {
  const rank = (t) => (t.priority === 'urgent' ? 0 : 1);
  return [...arr].sort((a, b) => rank(a) - rank(b) || (a.dueDate || '9999').localeCompare(b.dueDate || '9999') || (a.createdAt || '').localeCompare(b.createdAt || ''));
}

function queueSignedUrl(f) {

/* downscale a photo before upload (long edge ≤ 1600px, JPEG) — a phone photo of 4–8MB becomes ~300–500KB */
function shrinkImage(file, max = 1600, quality = 0.82) {
  return new Promise((resolve) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      try {
        const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
        const w = Math.max(1, Math.round(img.naturalWidth * k)), h = Math.max(1, Math.round(img.naturalHeight * k));
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        c.toBlob((blob) => { URL.revokeObjectURL(url); resolve(blob ? { blob, w, h } : null); }, 'image/jpeg', quality);
      } catch (e) { URL.revokeObjectURL(url); resolve(null); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(null); };
    img.src = url;
  });
}

/* lay the flow blocks out on A4 pages (measured in the DOM), repeating the table head when a page starts mid-table */
function paginateReport() {
  const flow = document.getElementById('rp-flow'), out = document.getElementById('rp-pages');
  if (!flow || !out) return;
  const PAGE_H = 1123, PAD = 56, MAX = PAGE_H - PAD * 2 - 30; // A4 @96dpi minus margins and the page footer line
  const blocks = [...flow.children];
  const pages = []; let cur = [], h = 0, lastHead = null;
  blocks.forEach((el) => {
    const bh = el.getBoundingClientRect().height + 8;
    if (el.classList.contains('rp-thead')) lastHead = el;
    if (h + bh > MAX && cur.length) {
      pages.push(cur); cur = []; h = 0;
      if (el.classList.contains('rp-tr') && lastHead) { const c = lastHead.cloneNode(true); cur.push(c); h += lastHead.getBoundingClientRect().height + 8; }
    }
    cur.push(el.cloneNode(true)); h += bh;
  });
  if (cur.length) pages.push(cur);
  out.innerHTML = '';
  pages.forEach((els, i) => {
    const pg = document.createElement('div'); pg.className = 'rp-page';
    const inner = document.createElement('div'); inner.className = 'rp-page-in';
    els.forEach((el) => inner.appendChild(el));
    const foot = document.createElement('div'); foot.className = 'rp-pagefoot'; foot.innerHTML = `<span>${esc(settings().officeName || 'OBERSON')} GO · ${esc(document.title.replace(/ — .*$/, ''))}</span><span>עמוד ${i + 1} מתוך ${pages.length}</span>`;
    pg.appendChild(inner); pg.appendChild(foot); out.appendChild(pg);
  });
  flow.hidden = true;
}
const loadScriptOnce = (src) => new Promise((res, rej) => { if ([...document.scripts].some((s) => s.src === src)) return res(); const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('script ' + src)); document.head.appendChild(s); });

async function startRecording(visitId) {
  if (S.ui.rec) return;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const type = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus'].find((t) => MediaRecorder.isTypeSupported(t)) || '';
    const recorder = new MediaRecorder(stream, type ? { mimeType: type, audioBitsPerSecond: 64000 } : undefined);
    const chunks = [];
    recorder.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
    recorder.onstop = () => {
      const r = S.ui.rec; S.ui.rec = null; clearInterval(r && r.timer);
      stream.getTracks().forEach((t) => t.stop());
      const mime = recorder.mimeType || type || 'audio/webm';
      const ext = /mp4/.test(mime) ? 'm4a' : /ogg/.test(mime) ? 'ogg' : 'webm';
      const blob = new Blob(chunks, { type: mime });
      const v = S.site_visits[visitId];
      if (blob.size < 1000 || !v) { toast('ההקלטה ריקה'); render(); return; }
      const file = new File([blob], `recording-${todayStr()}.${ext}`, { type: mime, lastModified: Date.now() });
      uploadFiles([file], { projectId: v.projectId, visitId, caption: 'הקלטה ' + fmtDateTime(nowIso()), durationSec: r ? Math.round((Date.now() - r.startedAt) / 1000) : null });
      render();
    };
    recorder.start(1000);
    S.ui.rec = { visitId, recorder, startedAt: Date.now(), timer: setInterval(() => { const el = document.getElementById('rec-timer'); if (el && S.ui.rec) el.textContent = fmtDur((Date.now() - S.ui.rec.startedAt) / 1000); }, 1000) };
    render();
  } catch (e) { console.warn(e); toast(/NotAllowed|Permission/i.test(String(e)) ? 'אין הרשאה למיקרופון' : 'ההקלטה לא נתמכת בדפדפן הזה'); }
}
function stopRecording() { const r = S.ui.rec; if (r && r.recorder && r.recorder.state !== 'inactive') r.recorder.stop(); else { S.ui.rec = null; render(); } }
async function transcribeFile(fileId, action = 'start') {
  const f = S.files[fileId]; if (!f) return;
  if (action === 'start') { f.transcribeStatus = 'running'; f.transcribeError = ''; render(); }
  try {
    const { data, error } = await sb.functions.invoke('transcribe', { body: { fileId, action } });
    if (error) throw new Error((error.context && error.context.status) ? await error.context.json().then((j) => j.error || error.message).catch(() => error.message) : error.message);
    if (data && data.error) throw new Error(data.error);
    if (data && data.status === 'running') { clearTimeout(S.ui.transcribePoll); S.ui.transcribePoll = setTimeout(() => transcribeFile(fileId, 'poll'), 12000); return; }
    await Promise.all([fetchTable('files'), fetchTable('visit_items'), fetchTable('site_visits')]);
    render();
    if (data && data.status === 'done') toast(data.items ? `התמלול הושלם — ${data.items} פריטים מוצעים נוספו לבדיקה` : 'התמלול הושלם' + (data.summarized ? ' והסיכום נכתב' : ''));
  } catch (e) {
    console.warn(e); const ff = S.files[fileId]; if (ff) { ff.transcribeStatus = 'error'; ff.transcribeError = String(e.message || e); }
    toast('התמלול נכשל: ' + friendlyError(e)); render();
  }
}

  if (col === 'project_milestones' && !isMember()) { toast('אין לך הרשאת עריכה'); render(); return; }
  if (col === 'milestone_types' && !isManager()) { toast('אין לך הרשאת עריכה'); render(); return; }
  if (col === 'employee_levels') { // the row may not exist yet: create it on first edit; an empty level means "back to automatic"
    if (!canEditLevel(S.contacts[id])) { toast('אין לך הרשאת עריכה'); render(); return; }
    delete S.ui.drafts[el.id];

    setEmpLevel(id, { [key]: v }); return;
  }
  let v;
  if (el.type === 'checkbox') v = el.checked;
  else if (el.type === 'number') v = el.value === '' ? null : Number(el.value);
  else v = el.value;
  if (['teamId', 'leadId', 'phase', 'clientId', 'projectId', 'supplierId', 'startDate', 'dueDate', 'expectedDate', 'invoiceDate', 'paidDate', 'assigneeId', 'phaseId', 'parentId', 'responsibleId', 'nextVisit', 'typeId', 'phase', 'milestoneId'].includes(key) && v === '') v = null;

const CRC_TABLE = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();

    { name: '_rels/.rels', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>` },
    { name: 'xl/workbook.xml', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${sheets.map((s, i) => `<sheet name="${xesc(s.name)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('')}</sheets></workbook>` },
    { name: 'xl/_rels/workbook.xml.rels', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheets.map((_, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('')}<Relationship Id="rId${sheets.length + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>` },
    { name: 'xl/styles.xml', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="1"><font><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>` },
