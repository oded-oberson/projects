<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>OBERSON GO</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23fff'/%3E%3Ccircle cx='16' cy='16' r='11.5' fill='none' stroke='%23000' stroke-width='3'/%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link rel="preconnect" href="https://use.typekit.net" crossorigin>
<link rel="preconnect" href="https://oberson-arch.com" crossorigin>
<link rel="stylesheet" href="https://use.typekit.net/iqp8fqo.css">
<style>
  /* Narkiss Block: the office's Hebrew typeface, served from the office website (same files the site uses). */
  @font-face { font-family: "Narkiss Block"; font-weight: 400; font-style: normal; font-display: swap; src: url("https://oberson-arch.com/wp-content/themes/oberson/fonts/NarkissBlock-Regular.woff2") format("woff2"); }
  @font-face { font-family: "Narkiss Block"; font-weight: 200; font-style: normal; font-display: swap; src: url("https://oberson-arch.com/wp-content/themes/oberson/fonts/NarkissBlock-Extralight.woff2") format("woff2"); }

  :root {
    color-scheme: light;
    --bg: #ffffff;
    --surface: #ffffff;
    --surface-2: #f4f4f4;
    --ink: #000000;
    --ink-2: #4b4b4b;
    --ink-3: #8a8a8a;
    --line: #e4e4e4;
    --line-2: #bcbcbc;
    --rule: #000000;
    --accent: #000000;
    --accent-2: #333333;
    --accent-ink: #ffffff;
    --accent-soft: #f2f2f2;
    --accent-soft-2: #d9d9d9;
    --bar: #000000;
    --bar-2: #cfcfcf;
    --good: #3f8f5f;
    --good-ink: #256b44;
    --good-soft: #eaf3ed;
    --warn: #d5a021;
    --warn-ink: #7a5a00;
    --warn-soft: #faf2da;
    --crit: #c62828;
    --crit-ink: #a11f1f;
    --crit-soft: #fbe7e7;
    --shadow: 0 10px 40px rgba(0, 0, 0, 0.10);
    --radius: 0px;
    --font-ui: "Narkiss Block", "futura-pt", "Heebo", "Segoe UI", Arial, sans-serif;
    --font-display: "Narkiss Block", "futura-pt", "Heebo", Arial, sans-serif;
    --font-num: "futura-pt", "Narkiss Block", "Heebo", Arial, sans-serif;
    --go: #00ab4e; /* Pantone Green C — the GO that continues the wordmark */
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-ui);
    font-size: 15px;
    line-height: 1.5;
    font-synthesis: none;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: inherit; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
  a:hover { text-decoration-color: var(--ink-3); }
  strong, b { font-weight: 400; }
  :focus-visible { outline: 1px solid var(--ink); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }

  #app { direction: rtl; min-height: 100%; display: flex; flex-direction: column; }
  .logo { display: block; width: 196px; height: auto; aspect-ratio: 1306 / 162.4; color: var(--ink); }
  .logo-go { color: var(--go); } /* the GO drawn into the wordmark: same stroke as the logo, G touching the N, Pantone Green C */
  .logo use, .logo path { fill: currentColor; }

  /* ---------- masthead ---------- */
  .masthead {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
    background: var(--surface);
    border-bottom: 1px solid var(--rule);
  }
  .masthead-inner {
    max-width: 1480px; margin: 0 auto; padding-inline: 24px;
    display: flex; align-items: center; gap: 28px; flex-wrap: wrap; min-height: 64px;
  }
  .brand { display: inline-flex; align-items: baseline; padding: 12px 0; border: 0; background: none; min-width: 0; direction: ltr; }
  .brand .logo { width: 198px; }
  .brand:hover .logo { color: var(--ink-2); }
  .brand-office { display: none; }
  .brand-title { font-family: var(--font-display); font-weight: 200; font-size: 22px; line-height: 1.2; color: var(--ink); letter-spacing: .02em; }
  .nav { display: flex; gap: 4px; flex-wrap: wrap; margin-inline-start: auto; }
  .nav button {
    background: none; border: 0; border-bottom: 1px solid transparent;
    padding: 21px 10px 18px; color: var(--ink-2); font-weight: 400; letter-spacing: .04em; border-radius: 0; white-space: nowrap; line-height: 1.2;
  }
  .nav button:hover { color: var(--ink); }
  .nav button[aria-current="page"] { color: var(--ink); border-bottom-color: var(--ink); }
  .head-tools { display: flex; align-items: center; gap: 12px; }
  .sync { font-size: 12.5px; color: var(--ink-3); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; letter-spacing: .03em; }
  .sync-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--line-2); }
  .sync-dot.on { background: var(--good); }
  .sync-dot.err { background: var(--crit); }
  .sync-dot.saving { background: var(--warn); }
  .sync-dot.pending { background: var(--warn); box-shadow: 0 0 0 3px var(--warn-soft); }

  /* ---------- page ---------- */
  .page { flex: 1; width: 100%; max-width: 1480px; margin: 0 auto; padding-inline: 24px; padding-block: 28px 72px; }
  .view-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
  .view-title { font-family: var(--font-display); font-weight: 200; font-size: 36px; line-height: 1.1; margin: 0; letter-spacing: .01em; text-wrap: balance; }
  .view-sub { color: var(--ink-2); margin-top: 6px; }
  .view-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

  /* ---------- buttons ---------- */
  .btn {
    display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 0;
    border: 1px solid var(--ink); background: var(--surface); color: var(--ink); font-weight: 400; line-height: 1.2; letter-spacing: .03em;
    white-space: nowrap; transition: background-color .15s ease, color .15s ease, border-color .15s ease;
  }
  .btn:hover { background: var(--ink); color: var(--accent-ink); }
  .btn.primary { background: var(--ink); border-color: var(--ink); color: var(--accent-ink); }
  .btn.primary:hover { background: var(--accent-2); border-color: var(--accent-2); }
  .btn.danger { color: var(--crit-ink); border-color: var(--crit-soft); background: transparent; }
  .btn.danger:hover { background: var(--crit-soft); color: var(--crit-ink); }
  .btn.small { padding: 5px 11px; font-size: 13.5px; }
  .btn.ghost { border-color: transparent; background: transparent; color: var(--ink); padding-inline: 6px; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
  .btn.ghost:hover { background: transparent; color: var(--ink-2); }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .btn svg { width: 15px; height: 15px; }

  /* ---------- tiles ---------- */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin-bottom: 22px; }
  .tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px 14px; min-width: 0; text-align: start; display: flex; flex-direction: column; align-items: stretch; justify-content: flex-start; font: inherit; color: inherit; transition: border-color .15s ease; }
  .tile-label svg { width: 11px; height: 11px; flex: none; }
  .tile.clickable { cursor: pointer; }
  .tile.clickable:hover { border-color: var(--ink); }
  .tile-label { font-size: 13px; color: var(--ink-2); display: flex; align-items: center; gap: 6px; letter-spacing: .02em; }
  .tile-value { font-family: var(--font-num); font-weight: 300; font-size: 40px; line-height: 1; margin-top: 10px; letter-spacing: .02em; font-variant-numeric: tabular-nums; }
  .tile-sub { font-size: 12.5px; color: var(--ink-3); margin-top: 8px; }
  .tile.hero .tile-value { font-size: 54px; }
  .tile.crit .tile-value { color: var(--crit-ink); }
  .tile.warn .tile-value { color: var(--warn-ink); }

  /* ---------- panels ---------- */
  .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 12px; align-items: start; }
  .grid-2 > * { min-width: 0; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; min-width: 0; }
  .panel.span-2 { grid-column: 1 / -1; }
  .panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 14px; padding-bottom: 8px; border-bottom: 1px solid var(--rule); }
  .panel-title { font-weight: 400; font-size: 15px; margin: 0; letter-spacing: .05em; }
  .panel-sub { color: var(--ink-3); font-size: 12.5px; }
  .eyebrow { font-size: 11.5px; letter-spacing: .12em; color: var(--ink-3); font-weight: 400; }
  .empty { color: var(--ink-3); font-size: 13.5px; padding: 10px 0; }
  .empty .btn { margin-top: 8px; }

  /* ---------- bar list ---------- */
  .bars { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
  .bar-row { min-width: 0; display: grid; grid-template-columns: minmax(96px, 150px) 1fr auto; align-items: center; gap: 10px; min-height: 22px; }
  .bar-row.clickable { cursor: pointer; }
  .bar-row.clickable:hover .bar-label { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
  .bar-label { font-size: 13.5px; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-label small { color: var(--ink-3); }
  .bar-track { height: 8px; background: var(--surface-2); border-radius: 0; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--bar); border-radius: 0; min-width: 2px; transition: width .25s ease; }
  .bar-fill.muted { background: var(--bar-2); }
  .bar-fill.good { background: var(--good); }
  .bar-fill.warn { background: var(--warn); }
  .bar-fill.crit { background: var(--crit); }
  .bar-val { font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; min-width: 34px; text-align: start; }
  .bar-val strong { color: var(--ink); font-weight: 400; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-2); margin-top: 12px; }
  .legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 0; margin-inline-end: 6px; vertical-align: -1px; background: var(--bar); }
  .legend span.muted::before { background: var(--bar-2); }

  /* ---------- health / chips ---------- */
  .chip {
    display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 2px;
    font-size: 12.5px; font-weight: 400; border: 1px solid var(--line-2); background: transparent; color: var(--ink-2);
    white-space: nowrap; max-width: 100%; line-height: 1.4; letter-spacing: .02em;
  }
  .chip.btn-chip { cursor: pointer; }
  .chip.btn-chip:hover { border-color: var(--ink); color: var(--ink); }
  .chip.green { background: var(--good-soft); color: var(--good-ink); border-color: transparent; }
  .chip.yellow { background: var(--warn-soft); color: var(--warn-ink); border-color: transparent; }
  .chip.red { background: var(--crit-soft); color: var(--crit-ink); border-color: transparent; }
  .chip.accent { background: transparent; color: var(--ink); border-color: var(--ink); }
  .chip.dim { color: var(--ink-3); border-style: dashed; background: transparent; }
  .chip svg { width: 10px; height: 10px; flex: none; }
  .chip .x { margin-inline-start: 2px; border: 0; background: none; color: inherit; opacity: .6; padding: 0 2px; line-height: 1; border-radius: 0; }
  .chip .x:hover { opacity: 1; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips-sub { margin: -6px 0 14px; padding-top: 10px; border-top: 1px solid var(--line); }
  .chips-sub .chip { font-size: 12px; padding: 2px 8px; }
  .chips-sub .chip small, .chips .chip small { color: var(--ink-3); font-size: 11px; }
  /* social links: "Network handle" chips; the network name is the label, no logos */
  .chip.social { padding: 0; overflow: hidden; }
  .chip.social a { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; color: inherit; text-decoration: none; min-width: 0; }
  .chip.social a:hover { color: var(--ink); background: var(--surface-2, rgba(0,0,0,.03)); }
  .chip.social .net { font-weight: 500; letter-spacing: .01em; }
  .chip.social .ltr { color: var(--ink-3); max-width: 180px; overflow: hidden; text-overflow: ellipsis; }
  .chip.social .x { margin: 0 4px 0 6px; }
  .social-field .add-row { margin-top: 6px; }
  .social-field .add-row input { direction: ltr; text-align: left; font-size: 13px; }
  /* English publishing name under the Hebrew one */
  .en { direction: ltr; unicode-bidi: isolate; display: inline-block; letter-spacing: .02em; color: var(--ink-2); }
  .drawer-en { margin-top: 2px; font-size: 15px; }
  .drawer-en .en { color: var(--ink); }
  .en.copy { cursor: copy; border-bottom: 1px dashed var(--line-2); }
  .en.copy:hover { border-bottom-color: var(--ink); }
  .cell-sub .en { color: var(--ink-3); }
  .table-more { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 12px; border-top: 1px solid var(--line); font-size: 13px; }

  /* ---------- filters ---------- */
  .filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
  .filters .field { margin: 0; }
  .search { position: relative; flex: 1 1 220px; max-width: 360px; }
  .search input { padding-inline-start: 32px; }
  .search svg { position: absolute; inset-inline-start: 10px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--ink-3); }
  .filters select, .filters input { height: 36px; }
  .filters select { width: auto; max-width: 220px; }
  .filters .search input[type="search"] { padding-inline-start: 32px; }
  .count-note { color: var(--ink-3); font-size: 13px; margin-inline-start: auto; }

  /* ---------- forms ---------- */
  input[type="text"], input[type="number"], input[type="date"], input[type="search"], input[type="tel"], input[type="email"], input[type="password"], select, textarea {
    width: 100%; padding: 7px 10px; border: 1px solid var(--line-2); border-radius: 0; background: var(--surface); color: var(--ink);
    min-width: 0; transition: border-color .15s ease;
  }
  input:hover, select:hover, textarea:hover { border-color: var(--ink-2); }
  input:focus, select:focus, textarea:focus { border-color: var(--ink); outline: none; }
  textarea { resize: vertical; min-height: 64px; }
  select { appearance: auto; }
  .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; min-width: 0; }
  .field label { font-size: 12.5px; color: var(--ink-2); font-weight: 400; letter-spacing: .04em; }
  .field-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px 12px; }
  .inline-note { font-size: 12.5px; color: var(--ink-3); }
  .ltr { direction: ltr; unicode-bidi: isolate; display: inline-block; }
  .switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13.5px; }
  .switch input { width: auto; accent-color: #000; }
  input[type="checkbox"], input[type="radio"] { accent-color: #000; }

  /* ---------- table ---------- */
  .table-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 10px 12px; text-align: start; vertical-align: middle; border-bottom: 1px solid var(--line); }
  th { font-size: 12.5px; color: var(--ink-2); font-weight: 400; letter-spacing: .05em; white-space: nowrap; background: var(--surface); position: sticky; top: 0; border-bottom: 1px solid var(--rule); }
  th.sortable { cursor: pointer; user-select: none; }
  th.sortable:hover { color: var(--ink); }
  th .arrow { font-size: 10px; margin-inline-start: 3px; color: var(--ink); }
  tr:last-child td { border-bottom: 0; }
  tbody tr.row-click { cursor: pointer; }
  tbody tr.row-click:hover { background: var(--surface-2); }
  td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  td.col-main { min-width: 220px; }
  .cell-main { font-weight: 400; color: var(--ink); }
  .cell-sub { font-size: 12.5px; color: var(--ink-3); margin-top: 1px; }
  .cell-note { color: var(--ink-2); max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  td .chip { cursor: pointer; }
  .tag { font-size: 11px; padding: 1px 6px; border-radius: 2px; background: var(--warn-soft); color: var(--warn-ink); margin-inline-start: 6px; vertical-align: 1px; letter-spacing: .03em; }
  .tag.internal { background: transparent; color: var(--ink-3); border: 1px solid var(--line); }
  .stale { color: var(--warn-ink); }
  .never { color: var(--ink-3); }

  /* ---------- attention list ---------- */
  .list { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0; }
  .list-item { min-width: 0; display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
  .list-item:last-child { border-bottom: 0; }
  .list-item:hover .li-title { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
  .li-body { flex: 1; min-width: 0; }
  .li-title { font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .li-sub { font-size: 12.5px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .li-side { font-size: 12.5px; color: var(--ink-3); white-space: nowrap; }

  /* ---------- completeness ---------- */
  .todo-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
  .todo-card { border: 1px dashed var(--line-2); border-radius: 0; padding: 12px 14px; cursor: pointer; background: transparent; text-align: start; color: var(--ink); font: inherit; transition: border-color .15s ease; }
  .todo-card:hover { border-color: var(--ink); border-style: solid; }
  .todo-card strong { font-family: var(--font-num); font-size: 26px; font-weight: 300; display: block; line-height: 1.1; letter-spacing: .02em; }
  .todo-card span { font-size: 13px; color: var(--ink-2); }
  .todo-card.done { opacity: .45; cursor: default; }

  /* ---------- drawer ---------- */
  .scrim { position: fixed; inset: 0; background: rgba(255, 255, 255, 0.55); z-index: 30; }
  .drawer {
    position: fixed; top: 0; bottom: 0; inset-inline-end: 0; width: min(600px, 100%); z-index: 31;
    background: var(--surface); border-inline-start: 1px solid var(--rule); box-shadow: var(--shadow); display: flex; flex-direction: column;
    padding-top: env(safe-area-inset-top, 0px);
  }
  .drawer-head { display: flex; align-items: flex-start; gap: 10px; padding: 20px 24px 14px; border-bottom: 1px solid var(--rule); }
  .drawer-title { font-family: var(--font-display); font-weight: 400; font-size: 23px; line-height: 1.2; margin: 0; }
  .drawer-title input { font-family: var(--font-display); font-weight: 400; font-size: 23px; padding: 2px 6px; margin-inline-start: -6px; border-color: transparent; background: transparent; }
  .drawer-title input:hover, .drawer-title input:focus { border-color: var(--line-2); background: var(--surface); }
  .drawer-sub { color: var(--ink-3); font-size: 13px; margin-top: 4px; }
  .drawer-body { flex: 1; overflow-y: auto; padding: 18px 24px 40px; }
  .drawer-foot { border-top: 1px solid var(--line); padding: 10px 24px; display: flex; justify-content: space-between; gap: 8px; align-items: center; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }
  .icon-btn { border: 0; background: transparent; color: var(--ink-2); width: 32px; height: 32px; border-radius: 0; display: inline-flex; align-items: center; justify-content: center; flex: none; }
  .icon-btn:hover { background: var(--surface-2); color: var(--ink); }
  .icon-btn svg { width: 18px; height: 18px; }
  .section { margin-bottom: 24px; }
  .section-title { font-weight: 400; font-size: 13px; letter-spacing: .06em; margin: 0 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--rule); display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .section-title small { color: var(--ink-3); font-weight: 400; letter-spacing: 0; }
  .status-box { background: var(--surface-2); border: 1px solid transparent; border-radius: 0; padding: 12px; }
  .status-box textarea { background: var(--surface); }
  .status-meta { font-size: 12.5px; color: var(--ink-3); }
  .health-picker { display: flex; gap: 6px; flex-wrap: wrap; }
  .health-picker .chip { cursor: pointer; opacity: .5; }
  .health-picker .chip.on { opacity: 1; box-shadow: 0 0 0 1px currentColor; }
  .role-row { display: grid; grid-template-columns: 110px 1fr; gap: 8px; align-items: start; padding: 6px 0; border-bottom: 1px dashed var(--line); }
  .role-row:last-child { border-bottom: 0; }
  .role-name { font-size: 13px; color: var(--ink-2); padding-top: 4px; }
  .role-body { min-width: 0; }
  .linked { display: grid; gap: 4px; }
  .linked a { text-decoration: none; }
  .linked a:hover { text-decoration: underline; }
  .comm-row { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px dashed var(--line); font-size: 13.5px; }
  .comm-row:last-child { border-bottom: 0; }
  /* contract milestones (work list) */
  .ms-list { display: grid; gap: 6px; margin-top: 8px; }
  .ms-group { font-size: 12px; color: var(--ink-2); letter-spacing: .03em; padding: 10px 0 2px; }

  /* ---------- the project journey: a stepper + stages holding milestones ----------
     stage colours: done ✓ green · in work yellow · late red · stuck orange · not started grey */
  :root { --stg-done: var(--go); --stg-active: #f2c230; --stg-active-ink: #5d4300; --stg-late: #d3302f; --stg-stuck: #ef8a2a; --stg-todo: #d9d9d9; }

  .step::before { content: ""; position: absolute; top: 15px; inset-inline-start: 50%; width: 100%; height: 2px; background: var(--stg-todo); z-index: 0; }
  .step:last-child::before { display: none; }
  .step.done::before { background: var(--stg-done); }
  .step-dot { position: relative; z-index: 1; width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--stg-todo); background: var(--surface); color: var(--ink-3); font: 500 12.5px/1 var(--font-num); display: inline-flex; align-items: center; justify-content: center; padding: 0; cursor: default; transition: transform .12s ease, box-shadow .12s ease; }
  .step-dot svg { width: 16px; height: 16px; }

  .step.done .step-dot { background: var(--stg-done); border-color: var(--stg-done); color: #fff; }
  .step.active .step-dot { background: var(--stg-active); border-color: var(--stg-active); color: var(--stg-active-ink); box-shadow: 0 0 0 4px rgba(242, 194, 48, .28); }
  .step.late .step-dot { background: var(--stg-late); border-color: var(--stg-late); color: #fff; box-shadow: 0 0 0 4px rgba(211, 48, 47, .22); font-weight: 700; }
  .step.stuck .step-dot { background: var(--stg-stuck); border-color: var(--stg-stuck); color: #fff; box-shadow: 0 0 0 4px rgba(239, 138, 42, .25); }
  .step-label { font-size: 12px; line-height: 1.2; color: var(--ink-3); max-width: 100%; padding: 0 3px; overflow-wrap: anywhere; }
  .step.current .step-label { color: var(--ink); font-weight: 600; }
  .step.done .step-label { color: var(--ink-2); }
  .step-sub { font-size: 11px; line-height: 1.2; color: var(--ink-3); padding: 0 3px; }
  .step.late .step-sub { color: var(--stg-late); font-weight: 600; }
  .step.stuck .step-sub { color: #a85b12; font-weight: 600; }
  .stage-confirm { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 8px 10px; margin-bottom: 8px; border: 1px solid var(--warn); background: var(--warn-soft); font-size: 13px; }

    .step::before { top: 13px; }
    .step-label { font-size: 10.5px; }
    .step-sub { display: none; }

  /* ---------- tasks ---------- */
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--rule); margin-bottom: 18px; overflow-x: auto; }
  .tabs button { background: none; border: 0; border-bottom: 1px solid transparent; margin-bottom: -1px; padding: 8px 14px 10px; color: var(--ink-2); font-weight: 400; letter-spacing: .04em; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; border-radius: 0; }
  .tabs button:hover { color: var(--ink); }
  .tabs button.on { color: var(--ink); border-bottom-color: var(--ink); }
  .tab-badge { background: var(--crit); color: #fff; font-size: 11px; border-radius: 0; padding: 0 6px; line-height: 16px; }
  .task-group { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 16px; margin-bottom: 10px; }
  .task-group-head { display: flex; align-items: baseline; gap: 8px; font-weight: 400; letter-spacing: .05em; margin-bottom: 2px; }
  .task-group-head small { color: var(--ink-3); font-weight: 400; letter-spacing: 0; }
  .task-group.crit .task-group-head { color: var(--crit-ink); }
  .task-group.warn .task-group-head { color: var(--warn-ink); }
  .task-item { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); cursor: pointer; min-width: 0; }
  .task-item:last-child { border-bottom: 0; }
  .task-item:hover .li-title { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
  .task-item.is-done .li-title { text-decoration: line-through; color: var(--ink-3); }
  .task-check { width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--line-2); background: transparent; flex: none; display: inline-flex; align-items: center; justify-content: center; padding: 0; color: #fff; }
  .task-check:hover { border-color: var(--ink); }
  .task-check.done { background: var(--ink); border-color: var(--ink); }
  .task-check.in_progress { border-color: var(--ink); border-width: 2px; }
  .task-check.waiting { border-color: var(--warn); border-style: dashed; }
  .task-check svg { width: 14px; height: 14px; }
  .prio { color: var(--crit); display: inline-flex; margin-inline-end: 4px; vertical-align: -2px; }
  .prio svg { width: 12px; height: 12px; }
  .due { font-size: 12.5px; color: var(--ink-3); white-space: nowrap; }
  .due.crit { color: var(--crit-ink); }
  .due.warn { color: var(--warn-ink); }
  .li-side { display: inline-flex; align-items: center; gap: 8px; }
  .li-side .status-chip { font-size: 11px; padding: 1px 7px; }
  .task-details { margin: 6px 0 10px; }
  .task-details summary { cursor: pointer; color: var(--ink-2); font-weight: 400; padding: 6px 0; letter-spacing: .03em; }
  .task-details summary small { color: var(--ink-3); }
  .task-quick { margin-bottom: 14px; }
  .task-quick input { flex: 1; }
  .board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; align-items: start; }
  .board-col { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; min-width: 0; }
  .board-col.done { opacity: .8; }
  .board-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; padding-bottom: 8px; border-bottom: 1px solid var(--rule); }
  .board-head small { color: var(--ink-3); }
  .board-empty { color: var(--line-2); text-align: center; padding: 12px 0; }
  .status-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .status-row .chip { cursor: pointer; }
  .status-row .chip.on { background: var(--ink); color: #fff; border-color: var(--ink); box-shadow: none; }
  .status-row .chip.red.on { background: var(--crit); border-color: var(--crit); color: #fff; }
  .checklist { display: grid; gap: 2px; margin-bottom: 8px; }
  .check-row { display: flex; align-items: center; gap: 6px; }
  .check-row label { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; cursor: pointer; padding: 4px 0; }
  .check-row input { width: auto; }
  .check-row.done span { text-decoration: line-through; color: var(--ink-3); }
  .comments { display: grid; gap: 8px; margin-bottom: 12px; }
  .comment { background: var(--surface-2); border-radius: 0; padding: 9px 12px; }
  .comment-head { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-3); }
  .comment-who { font-weight: 400; color: var(--ink); }
  .comment-head .icon-btn { margin-inline-start: auto; }
  .comment-body { margin-top: 3px; overflow-wrap: anywhere; }
  .comment.system { background: transparent; padding: 2px 12px; font-size: 13px; color: var(--ink-3); }
  .comment.system time { margin-inline-start: 6px; }
  .mention { color: var(--ink); background: var(--accent-soft); padding: 0 3px; }
  .composer textarea { width: 100%; }
  .composer-tools { display: flex; justify-content: space-between; gap: 8px; margin-top: 6px; }
  .bell { position: relative; display: inline-flex; }
  .bell-btn { background: none; border: 1px solid transparent; border-radius: 0; width: 34px; height: 34px; display: inline-flex; align-items: center; justify-content: center; color: var(--ink-2); position: relative; padding: 0; }
  .bell-btn:hover, .bell-btn.has { color: var(--ink); }
  .bell-btn svg { width: 20px; height: 20px; }
  .bell-count { position: absolute; top: 1px; inset-inline-end: 0; background: var(--crit); color: #fff; font-size: 10.5px; min-width: 16px; height: 16px; border-radius: 0; padding: 0 4px; display: inline-flex; align-items: center; justify-content: center; font-weight: 400; }
  .bell-pop { position: absolute; top: 40px; inset-inline-end: 0; width: min(380px, calc(100vw - 24px)); background: var(--surface); border: 1px solid var(--ink); border-radius: 0; box-shadow: var(--shadow); z-index: 35; direction: rtl; text-align: start; }
  .bell-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-bottom: 1px solid var(--rule); letter-spacing: .04em; }
  .bell-list { max-height: min(420px, 70vh); overflow-y: auto; }
  .notif { display: flex; flex-direction: column; gap: 2px; padding: 10px 14px; border-bottom: 1px solid var(--line); cursor: pointer; font-size: 14px; }
  .notif:last-child { border-bottom: 0; }
  .notif:hover { background: var(--surface-2); }
  .notif.unread { background: var(--accent-soft); }
  .notif time { font-size: 12px; color: var(--ink-3); }
  .notif-task { font-weight: 400; }
  @media (max-width: 900px) { .board { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 560px) { .board { grid-template-columns: 1fr; } }

  /* ---------- auth ---------- */
  .auth-wrap { min-height: calc(100vh - 40px); display: flex; align-items: center; justify-content: center; padding: 20px 0; }
  .auth-card { width: min(440px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 0; padding: 40px 36px 32px; }
  .auth-brand { margin-bottom: 28px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
  .auth-brand .logo { width: min(392px, 84%); }
  .auth-brand .brand-office { display: block; font-size: 12.5px; letter-spacing: .14em; color: var(--ink-2); }
  .auth-brand .brand-row { display: flex; align-items: baseline; justify-content: center; direction: ltr; width: 100%; }
  .auth-brand .brand-title { font-size: 20px; }
  .auth-title { font-family: var(--font-display); font-weight: 400; font-size: 20px; margin: 0 0 8px; letter-spacing: .02em; }
  .auth-tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--rule); margin-bottom: 18px; }
  .auth-tabs button { background: none; border: 0; border-bottom: 1px solid transparent; margin-bottom: -1px; padding: 8px 12px 10px; color: var(--ink-2); font-weight: 400; letter-spacing: .04em; }
  .auth-tabs button.on { color: var(--ink); border-bottom-color: var(--ink); }
  .auth-form { display: flex; flex-direction: column; gap: 4px; }
  .auth-form .btn.primary { margin-top: 6px; justify-content: center; }
  .auth-form .btn.ghost { align-self: flex-start; margin-top: 4px; }
  .user-name { font-size: 13.5px; color: var(--ink-2); max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #user-box { display: inline-flex; align-items: center; gap: 8px; }
  .row-inactive .cell-main { color: var(--ink-3); }
  .row-pending { background: var(--warn-soft); }
  .steps { margin: 0; padding-inline-start: 18px; color: var(--ink-2); font-size: 14px; display: grid; gap: 6px; }
  .modal { position: fixed; z-index: 46; inset-inline: 0; top: 18vh; margin: 0 auto; width: min(460px, calc(100% - 32px)); background: var(--surface); border: 1px solid var(--ink); border-radius: 0; padding: 22px 24px; box-shadow: var(--shadow); direction: rtl; }
  .audit { display: grid; gap: 0; max-height: 520px; overflow-y: auto; }
  .audit-row { display: grid; grid-template-columns: 92px 1fr; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .audit-row:last-child { border-bottom: 0; }
  .audit-when { color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .audit-who { font-weight: 400; }
  .audit-what { color: var(--ink); }
  .audit-diff { color: var(--ink-3); margin-top: 2px; overflow-wrap: anywhere; }

  /* ---------- field: visits, items, photos ---------- */
  .visit-ic { width: 22px; height: 22px; flex: none; color: var(--ink-2); display: inline-flex; }
  .visit-ic svg { width: 20px; height: 20px; }
  .vi-list { display: grid; gap: 10px; }
  .vi-row { border: 1px solid var(--line); padding: 10px 12px; background: var(--surface); }
  .vi-row.closed { opacity: .72; }
  .vi-row.closed .vi-body { text-decoration: line-through; color: var(--ink-3); }
  .vi-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
  .vi-no { font-family: var(--font-num); font-variant-numeric: tabular-nums; color: var(--ink-2); min-width: 34px; }
  .vi-loc { flex: 1; min-width: 140px; }
  .vi-body { width: 100%; resize: vertical; }
  .vi-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 6px; font-size: 13px; }
  .vi-due { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-3); font-size: 12.5px; }
  .vi-due input { width: auto; padding: 4px 6px; font-size: 13px; }
  .vi-carried { display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--line); }
  .vi-carried:last-child { border-bottom: 0; }
  .ph-strip { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
  .ph-strip.small { gap: 6px; }
  .ph { position: relative; width: 96px; height: 96px; margin: 0; border: 1px solid var(--line); background: var(--surface-2); overflow: hidden; cursor: pointer; }
  .ph-strip.small .ph, .ph-strip.small .ph-add { width: 72px; height: 72px; }
  .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ph-wait, .ph-file { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; color: var(--ink-3); gap: 4px; font-size: 11px; }
  .ph-file svg { width: 22px; height: 22px; }
  .ph-del { position: absolute; top: 2px; inset-inline-end: 2px; width: 22px; height: 22px; border: 0; background: rgba(255,255,255,.9); color: var(--ink); display: inline-flex; align-items: center; justify-content: center; padding: 0; opacity: 0; transition: opacity .15s ease; }
  .ph:hover .ph-del, .ph:focus-within .ph-del { opacity: 1; }
  @media (hover: none) { .ph-del { opacity: 1; } }
  .ph-del svg { width: 12px; height: 12px; }
  .ph-add { width: 96px; height: 96px; border: 1px dashed var(--line-2); display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--ink-2); cursor: pointer; font-size: 12px; text-align: center; padding: 4px; }
  .ph-add:hover { border-color: var(--ink); color: var(--ink); }
  .ph-add svg { width: 22px; height: 22px; }
  .ph.armed { outline: 2px solid var(--crit-ink, #b3261e); }
  .ph-confirm { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: rgba(255,255,255,.92); }
  .ph-confirm .btn { padding: 2px 8px; }
  /* ---------- files: rows, project slots (presentation / plan sets), task attachments ---------- */
  .file-list { display: flex; flex-direction: column; }
  .file-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); cursor: pointer; min-width: 0; }
  .file-row:last-child { border-bottom: 0; }
  .file-row.current { background: var(--surface-2, rgba(0,0,0,.025)); padding-inline: 8px; margin-inline: -8px; border-bottom: 0; }
  .file-row .li-title { font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: ltr; text-align: end; unicode-bidi: plaintext; }
  .file-row .icon-btn { opacity: .55; }
  .file-row:hover .icon-btn { opacity: 1; }
  .file-ic { flex: none; width: 40px; height: 40px; border: 1px solid var(--line); background: var(--surface-2, #fafafa); display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; color: var(--ink-3); font-size: 9px; letter-spacing: .04em; text-transform: uppercase; overflow: hidden; }
  .file-ic svg { width: 16px; height: 16px; }
  .file-ic img { width: 100%; height: 100%; object-fit: cover; }
  .file-ic.pdf { color: var(--crit-ink, #b3261e); }
  .upload-ctl { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .upload-ctl label.btn { cursor: pointer; }
  .slot { padding: 10px 0 12px; border-top: 1px solid var(--line); }
  .slot:first-of-type { border-top: 0; padding-top: 4px; }
  .slot-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 6px; }
  .slot-name { font-size: 13px; letter-spacing: .04em; color: var(--ink-2); }
  .slot .add-row { margin-top: 8px; flex-wrap: wrap; gap: 8px; align-items: center; }
  .file-list.older { margin-top: 8px; border-top: 1px dashed var(--line); }
  .set-block { border: 1px solid var(--line); margin-top: 6px; }
  .set-block.latest { border-color: var(--line-2); }
  .set-head { display: flex; align-items: center; gap: 10px; padding: 8px 10px; cursor: pointer; min-width: 0; }
  .set-no { font-family: var(--font-num); font-variant-numeric: tabular-nums; color: var(--ink-2); white-space: nowrap; }
  .set-meta { flex: 1; min-width: 0; color: var(--ink-3); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .set-body { padding: 4px 10px 10px; border-top: 1px solid var(--line); }
  .set-body .status-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .set-tools { justify-content: space-between; }
  .set-list.older { margin-top: 8px; }
  .set-cell { margin-top: 4px; }
  /* need-to-know: reduced rows and the reduced page */
  tr.row-click.reduced td { color: var(--ink-2); }
  tr.row-click.reduced .cell-main { font-weight: 300; }
  .pp-reduced { max-width: 860px; }
  /* ---------- project page ---------- */
  .pp-head { margin-bottom: 18px; }
  .pp-back { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: var(--ink-3); text-decoration: none; margin-bottom: 6px; }
  .pp-back:hover { color: var(--ink); }
  .pp-back svg { width: 14px; height: 14px; }
  .pp-title-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .pp-title { flex: 1; min-width: 0; }
  .pp-title .view-title input { font-family: var(--font-display); font-weight: 200; font-size: 36px; line-height: 1.1; padding: 2px 6px; margin-inline-start: -6px; border-color: transparent; background: transparent; width: 100%; letter-spacing: .01em; }
  .pp-title .view-title input:hover, .pp-title .view-title input:focus { border-color: var(--line-2); }
  .pp-en { font-size: 17px; margin-top: 2px; }
  .pp-en .en { color: var(--ink); }
  .pp-side-head { display: flex; align-items: center; gap: 8px; padding-top: 12px; }
  .pp-quick { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 10px; }
  .pp-quick .chip svg { width: 12px; height: 12px; }
  .pp-quick .chip small { font-size: 11px; color: inherit; opacity: .7; }
  .pp-jump { display: flex; flex-wrap: wrap; gap: 2px 16px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 8px 0; font-size: 13px; }
  .pp-jump a { color: var(--ink-2); text-decoration: none; padding: 2px 0; letter-spacing: .02em; }
  .pp-jump a:hover { color: var(--ink); }
  .pp-grid { display: grid; grid-template-columns: minmax(0, 3fr) minmax(300px, 1.35fr); gap: 20px; align-items: start; }
  .pp-main, .pp-side { padding: 20px 22px 8px; }
  .pp-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; margin-top: 6px; }
  .ph.gal { width: auto; height: auto; aspect-ratio: 4 / 3; }
  .ph.gal img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ph.gal figcaption { position: absolute; bottom: 0; inset-inline: 0; font-size: 11px; padding: 2px 6px; background: rgba(255,255,255,.85); }
  /* photoshoot & publication card */
  .shoot-card { border: 1px solid var(--line-2); padding: 14px 16px 6px; margin-bottom: 24px; background: var(--surface); position: relative; }
  .shoot-card::before { content: ""; position: absolute; inset-inline-start: 0; top: 0; bottom: 0; width: 4px; background: var(--warn-ink, #b7791f); }
  .shoot-card.scheduled::before { background: var(--ink); }
  .shoot-card.shot::before, .shoot-card.published::before { background: var(--good-ink, #2f7d4a); }
  .shoot-card.cancelled { opacity: .7; }
  .shoot-card.cancelled::before { background: var(--line-2); }
  .shoot-offer { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .shoot-steps { display: flex; flex-direction: column; }
  .shoot-step { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); min-width: 0; }
  .shoot-step:last-child { border-bottom: 0; }
  .shoot-step .switch { flex: none; }
  .shoot-step-title { flex: 1; min-width: 0; color: inherit; text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .shoot-step.done .shoot-step-title { color: var(--ink-3); text-decoration: line-through; }
  .fund-row { display: grid; grid-template-columns: minmax(120px, 1.2fr) 110px auto minmax(100px, 1fr) 28px; gap: 8px; align-items: center; padding: 4px 0; }
  .fund-row .fund-who { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .set-row.with-fn { grid-template-columns: minmax(0, 1fr) 150px 28px; }
  @media (max-width: 700px) { .fund-row { grid-template-columns: 1fr 90px auto; } .fund-row input[type="text"] { grid-column: 1 / -1; } }
  /* materials board */
  .mat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; margin-top: 6px; }
  .mat-card { border: 1px solid var(--line); background: var(--surface); cursor: pointer; display: flex; flex-direction: column; min-width: 0; transition: border-color .15s ease; }
  .mat-card:hover { border-color: var(--ink-2); }
  .mat-card.rejected { opacity: .6; }
  .mat-img { position: relative; aspect-ratio: 4 / 3; background: var(--surface-2); display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .mat-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .mat-noimg { color: var(--ink-3); width: 28px; height: 28px; }
  .mat-noimg svg { width: 28px; height: 28px; }
  .mat-count { position: absolute; bottom: 4px; inset-inline-end: 4px; font-size: 11px; background: rgba(255,255,255,.9); padding: 1px 6px; font-family: var(--font-num); }
  .mat-body { padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .mat-title { font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mat-sub { font-size: 12px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-height: 15px; }
  .mat-foot { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-top: 4px; }
  .mat-price { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: 13px; color: var(--ink-2); }
  .photo-day { margin-top: 10px; }
  .photo-day-head { display: flex; align-items: baseline; gap: 10px; font-size: 13px; color: var(--ink-2); margin-bottom: 4px; }
  .photo-day-head small { color: var(--ink-3); }
  @media (max-width: 1000px) { .pp-grid { grid-template-columns: minmax(0, 1fr); } .pp-main, .pp-side { padding: 14px 14px 4px; } .pp-title .view-title input { font-size: 28px; } }
  .set-chip small { font-size: 11px; opacity: .8; }
  .set-body .status-row { margin-bottom: 4px; }
  .set-body .status-row .chip.green.on { background: var(--good-ink); border-color: var(--good-ink); color: #fff; }
  .set-body .status-row .chip.yellow.on { background: var(--warn-ink); border-color: var(--warn-ink); color: #fff; }
  .rec-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 12px; align-items: center; padding: 8px 0; border-bottom: 1px dashed var(--line); }
  .rec-row:last-of-type { border-bottom: 0; }
  .rec-main { min-width: 0; }
  .rec-main audio { width: 100%; max-width: 420px; height: 34px; display: block; }
  .rec-side { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .rec-transcript { grid-column: 1 / -1; font-size: 13px; }
  .rec-transcript summary { cursor: pointer; color: var(--ink-2); }
  .rec-transcript pre { white-space: pre-wrap; font: inherit; background: var(--surface-2); padding: 10px 12px; max-height: 320px; overflow-y: auto; margin: 6px 0 0; }
  .rec-timer { font-family: var(--font-num); font-variant-numeric: tabular-nums; margin-inline-start: 6px; }
  .crit-text { color: var(--crit-ink); font-size: 12.5px; }
  .chip.red { background: var(--crit-soft); color: var(--crit-ink); border-color: transparent; }
  .lightbox { position: fixed; inset: 0; z-index: 48; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 24px; cursor: zoom-out; }
  .lightbox img { max-width: 100%; max-height: calc(100% - 40px); object-fit: contain; box-shadow: var(--shadow); background: #fff; }
  .lightbox-cap { color: #fff; font-size: 13px; text-align: center; }

  /* ---------- report (screen + PDF pages) ---------- */
  .rp-tools { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
  .rp-note { font-size: 12.5px; color: var(--ink-3); margin-bottom: 16px; }
  .rp-doc { width: 794px; padding: 0 56px; box-sizing: border-box; background: #fff; }  /* measured at A4 width even on phones */
  .rp-pages { display: grid; gap: 18px; justify-content: center; }
  .rp-page { width: 794px; max-width: 100%; min-height: 1123px; background: #fff; border: 1px solid var(--line); box-shadow: 0 6px 30px rgba(0,0,0,.08); position: relative; direction: rtl; box-sizing: border-box; padding: 56px 56px 44px; display: flex; flex-direction: column; }
  .rp-page-in { flex: 1; }
  .rp-pagefoot { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--ink-3); border-top: 1px solid var(--line); padding-top: 6px; margin-top: 12px; letter-spacing: .04em; }
  .rp-b { margin-bottom: 8px; font-size: 13px; line-height: 1.45; }
  .rp-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; border-bottom: 1px solid var(--rule); padding-bottom: 12px; margin-bottom: 12px; }
  .rp-brand { display: flex; align-items: baseline; direction: ltr; }
  .rp-brand .logo { width: 196px; }
  .rp-titles { text-align: start; }
  .rp-title { font-family: var(--font-display); font-weight: 200; font-size: 26px; line-height: 1.1; letter-spacing: .01em; }
  .rp-title span { color: var(--ink-2); }
  .rp-project { font-size: 15px; margin-top: 4px; }
  .rp-project small { color: var(--ink-3); font-size: 12px; margin-inline-start: 6px; }
  .rp-subject { font-size: 13.5px; color: var(--ink-2); margin-top: 2px; }
  .rp-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 24px; padding: 8px 0 10px; border-bottom: 1px solid var(--line); }
  .rp-kv { display: grid; grid-template-columns: 84px 1fr; gap: 8px; font-size: 12.5px; }
  .rp-kv span { color: var(--ink-3); }
  .rp-kv strong { font-weight: 400; }
  .rp-section h3 { font-size: 13px; letter-spacing: .06em; font-weight: 400; margin: 10px 0 6px; padding-bottom: 4px; border-bottom: 1px solid var(--rule); display: flex; justify-content: space-between; }
  .rp-section h3 small { color: var(--ink-3); letter-spacing: 0; }
  .rp-section p { margin: 0; white-space: pre-line; }
  .rp-tbl-title { margin-bottom: 4px; }
  .rp-row { display: grid; grid-template-columns: 36px 46px 88px 1fr 92px 64px 44px; gap: 6px; padding: 5px 0; border-bottom: 1px dashed var(--line); font-size: 12px; align-items: start; }
  .rp-thead { margin-bottom: 0; }
  .rp-thead .rp-row { font-size: 10.5px; color: var(--ink-3); letter-spacing: .05em; border-bottom: 1px solid var(--rule); padding-bottom: 3px; }
  .rp-tr { margin-bottom: 0; }
  .rp-row.closed .c-body { color: var(--ink-3); text-decoration: line-through; }
  .rp-row .c-no { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
  .rp-row .c-body small { display: block; color: var(--ink-3); font-size: 10.5px; }
  .rp-photos { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 6px 0 10px; }
  .rp-photos figure { margin: 0; }
  .rp-img { width: 100%; height: 210px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
  .rp-img img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .rp-photos figcaption span { font-family: var(--font-num); color: var(--ink-3); margin-inline-end: 4px; }
  .rp-foot { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 10px; }
  .rp-disclaimer { font-size: 10.5px; color: var(--ink-3); margin: 0 0 14px; line-height: 1.4; }

  .rp-sign span { color: var(--ink-3); font-size: 10.5px; }
  .rp-sign strong { font-weight: 400; font-size: 14px; }
  .rp-sign small { color: var(--ink-3); }

  .drawer-save { display: flex; align-items: center; gap: 10px; padding: 10px 24px; border-top: 1px solid var(--ink); background: var(--warn-soft); font-size: 13.5px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }
  .drawer-save span { flex: 1; color: var(--warn-ink); }

  .banner { background: var(--warn-soft); color: var(--warn-ink); border: 1px solid transparent; border-radius: 0; padding: 12px 16px; margin-bottom: 16px; font-size: 14px; }
  .banner.info { background: var(--accent-soft); color: var(--ink); }
  .muted { color: var(--ink-3); }
  .nowrap { white-space: nowrap; }
  .confirm-inline { display: inline-flex; gap: 6px; align-items: center; }
  .kbd { font-size: 11px; color: var(--ink-3); border: 1px solid var(--line-2); border-radius: 0; padding: 0 4px; }
  .loading { padding: 80px 0; text-align: center; color: var(--ink-3); font-weight: 200; font-size: 20px; letter-spacing: .06em; }

  @media (max-width: 720px) {
    .masthead-inner { gap: 8px; padding-inline: 16px; }
    .brand { padding: 10px 0; }
    .brand .logo { width: 154px; }
    .nav { width: 100%; margin-inline-start: 0; overflow-x: auto; flex-wrap: nowrap; }
    .nav button { padding: 8px 9px 11px; }
    .head-tools { margin-inline-start: auto; gap: 6px; min-width: 0; }
    #sync-text, #btn-export .btn-text, #btn-request .btn-text, #user-box .chip { display: none; }
    .today-grid.four { grid-template-columns: 1fr; }
    .user-name { max-width: 90px; }
    #btn-export { padding: 5px 8px; }
    .page { padding-inline: 16px; padding-top: 20px; }

  }
</style>

function visibleProjects() {
  const f = S.ui.filters; const q = norm(f.q);
  let ps = P().filter((p) => {
    if (f.state && p.state !== f.state) return false;
    if (f.team && p.teamId !== f.team) return false;
    if (f.lead && p.leadId !== f.lead) return false;
    if (f.phase && (f.phase === 'none' ? !!activePhases(p).length : f.phase === '__done' ? !allPhasesDone(p) : !hasActivePhaseNamed(p, f.phase))) return false;
    if (f.health && (f.health === 'none' ? !!p.health : p.health !== f.health)) return false;
    if (f.type && p.type !== f.type) return false;
    if (f.flag === 'noPhase' && (activePhases(p).length || allPhasesDone(p))) return false;
    if (f.flag === 'noTeam' && p.teamId) return false;
    if (f.flag === 'noLead' && p.leadId) return false;
    if (f.flag === 'review' && !p.needsReview) return false;
    if (f.flag === 'stale' && !isStale(p)) return false;
    if ((f.flag === 'late' || f.flag === 'stuck') && currentStageRow(p)?.state !== f.flag) return false;
    if (q) {
      const hay = norm([p.name, p.nameEn, p.number, p.city, p.address, p.type, p.typeDetail, cname(p.clientId, ''), cname(p.leadId, ''), tname(p.teamId, ''), p.statusNote].join(' '));
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  const { key, dir } = S.ui.sort;
  const val = (p) => ({
    name: projectDisplayName(p) || '', client: cname(p.clientId, ''), team: tname(p.teamId, 'תתת'), lead: cname(p.leadId, 'תתת'),
    phase: (() => { const a = activePhases(p); if (!a.length) return allPhasesDone(p) ? 98 : 99; const i = settings().phases.findIndex((x) => x.name === a[0].name); return i < 0 ? 50 : i; })(), health: { red: 0, yellow: 1, green: 2 }[p.health] ?? 3,
    updated: p.statusUpdatedAt || '', start: p.startDate || '',
  })[key];
  ps.sort((a, b) => { const x = val(a), y = val(b); const r = typeof x === 'number' ? x - y : String(x).localeCompare(String(y), 'he'); return r * dir; });
  return ps;
}
function phaseFilterNames() {

  P().forEach((p) => activePhases(p).forEach((x) => { if (!tpl.includes(x.name)) extra.add(x.name); }));
  return [...tpl, ...[...extra].sort()];
}

function activeProjectCounts() {

  activeProjects().forEach((p) => {
    const seen = new Set();
    const hit = (id) => { if (id && !seen.has(id)) { seen.add(id); add(id); } };
    hit(p.clientId); (p.clientPersonIds || []).forEach(hit);
    ROLES.forEach((r) => r.single ? hit(p[r.field]) : (p[r.field] || []).forEach(hit));

  const ordered = CAT_LIST[tab] ? (settings()[CAT_LIST[tab]] || []).slice() : ORG_TYPES.slice();
  Object.keys(counts).forEach((k) => { if (k !== NO_CAT && !ordered.includes(k)) ordered.push(k); });
  const keys = ordered.filter((k) => counts[k]).concat(counts[NO_CAT] ? [NO_CAT] : []);
  if (keys.length < 2) return '';
  const cur = S.ui.ccat;

/* one line under a person's name: experience level and personal load (team leads and up), then the project counts */
function memberSub(c, act, loads) {

  if (!canSeeLevels()) return counts;
  const lvl = empLevel(c); const manual = manualLevel(c) != null; const lead = isTeamLead(c.id); const cl = capacityLevel(c); const u = utilInfo(loads[c.id] || 0, cl);
  return `<span class="lvl ${manual ? 'manual' : ''}" title="${manual ? 'רמה ידנית' : 'רמה אוטומטית לפי ותק: ' + esc(tenureLabel(c.startDate))}">רמה ${fmtNum(lvl, 2)}${manual ? '' : ' (אוטו׳)'}</span>${lead ? ` · <span title="ראש/ת צוות: רק ${Math.round(leadShare() * 100)}% מהמשרה נספרים לקיבולת הפרויקטים">ראש/ת צוות ${Math.round(leadShare() * 100)}% → ${fmtNum(cl, 2)}</span>` : ''} · <span class="util ${u.cls}" title="עומס אישי ${fmtNum(loads[c.id] || 0)} מתוך ${fmtNum(u.cap)}">${u.pct == null ? u.label : u.pct + '%'}</span> · ${counts}`;
}
/* load matrix: people, capacity (Σ levels × points per level), projects, load and utilisation per team */
function loadMatrix(act) {
  const rows = T().map((t) => { const ms = teamMembers(t.id); const ps = act.filter((p) => p.teamId === t.id); const load = sum(ps, projectWeight); const lv = sum(ms, capacityLevel); return { id: t.id, name: t.name, lead: cname(t.leadId, ''), n: ms.length, lv, ps: ps.length, load, u: utilInfo(load, lv), noStart: ms.filter((e) => !e.startDate && manualLevel(e) == null).length }; });
  const noTeam = act.filter((p) => !p.teamId);
  const tot = { n: sum(rows, (r) => r.n), lv: sum(rows, (r) => r.lv), ps: sum(rows, (r) => r.ps) + noTeam.length, load: sum(rows, (r) => r.load) + sum(noTeam, projectWeight) };
  tot.u = utilInfo(tot.load, tot.lv);

function dueInfo(t) {
  if (!t.dueDate) return { key: 'none', cls: '', label: '' };
  const d = String(t.dueDate).slice(0, 10);
  if (t.status === 'done') return { key: 'done', cls: '', label: fmtDate(d) };
  const diff = Math.round((new Date(d + 'T00:00:00') - new Date(todayStr() + 'T00:00:00')) / 86400000);
  if (diff < 0) return { key: 'overdue', cls: 'crit', label: diff === -1 ? 'אתמול' : `באיחור ${-diff} ימים` };
  if (diff === 0) return { key: 'today', cls: 'warn', label: 'היום' };
  if (diff === 1) return { key: 'week', cls: '', label: 'מחר' };
  if (diff <= 7) return { key: 'week', cls: '', label: `בעוד ${diff} ימים` };
  return { key: 'later', cls: '', label: fmtDate(d) };
}

function insertMention(taskId, userId, replaceLen) {
  const ta = document.getElementById('comment-' + taskId); if (!ta) return;
  const name = uname(userId);
  const pos = ta.selectionStart ?? ta.value.length;
  const before = ta.value.slice(0, pos - replaceLen), after = ta.value.slice(pos);
  ta.value = before + '@' + name + ' ' + after;
  S.ui.drafts[ta.id] = ta.value;
  (S.ui.mentions[taskId] = S.ui.mentions[taskId] || []).push({ id: userId, name });
  ta.focus(); const np = (before + '@' + name + ' ').length; ta.setSelectionRange(np, np);
}
function mentionTyping(ta) {
  const taskId = ta.dataset.comment;
  const pos = ta.selectionStart ?? ta.value.length;
  const m = /(^|\s)@([^\s@]*)$/.exec(ta.value.slice(0, pos));
  if (!m) { if (S.ui.menu && S.ui.menu.mention) closeMenu(); return; }
  const partial = m[2];
  const items = mentionCandidates(partial);
  if (!items.length) { if (S.ui.menu && S.ui.menu.mention) closeMenu(); return; }
  const cfg = { items, mention: true, onPick: (it) => insertMention(taskId, it.value, partial.length + 1) };
  if (S.ui.menu && S.ui.menu.mention) { Object.assign(S.ui.menu, cfg); renderMenu(); }
  else openMenu(ta, cfg);
}

  const id = uid('v');
  const ok = await createDoc('site_visits', id, { projectId, kind, seq, visitDate: extra.visitDate || todayStr(), visitTime: extra.visitTime || '', authorId: me()?.id || null, attendees: extra.attendees || '', summary: '', status: 'draft', finalizedAt: null, nextVisit: null, venue: kind === 'site' ? 'site' : (VENUES[extra.venue] ? extra.venue : 'office'), title: extra.title || '' });

}

function fileUrl(f) {
  if (!f) return '';
  const c = S.fileUrls[f.id];
  if (c && c.exp > Date.now()) return c.url;
  queueSignedUrl(f);
  return '';
}
let urlQueue = new Map(), urlTimer = 0;
function queueSignedUrl(f) {
  if (urlQueue.has(f.id) || (S.fileUrls[f.id] && S.fileUrls[f.id].pending)) return;
  urlQueue.set(f.id, f);
  clearTimeout(urlTimer);
  urlTimer = setTimeout(async () => {
    const batch = [...urlQueue.values()]; urlQueue = new Map();
    batch.forEach((x) => { S.fileUrls[x.id] = { url: '', exp: 0, pending: true }; });
    try {
      const { data, error } = await sb.storage.from(FILE_BUCKET).createSignedUrls(batch.map((x) => x.path), 3600);
      if (error) throw error;
      // a missing object is remembered for a minute (an empty url) — otherwise every render would ask again and re-render in a loop
      (data || []).forEach((row, i) => { const f = batch[i]; if (row && row.signedUrl) S.fileUrls[f.id] = { url: row.signedUrl, exp: Date.now() + 55 * 60000 }; else S.fileUrls[f.id] = { url: '', exp: Date.now() + 60000 }; });
    } catch (e) { console.warn('signed urls', e); batch.forEach((x) => { S.fileUrls[x.id] = { url: '', exp: Date.now() + 30000 }; }); }
    render();
  }, 30);
}
/* downscale a photo before upload (long edge ≤ 1600px, JPEG) — a phone photo of 4–8MB becomes ~300–500KB */
function shrinkImage(file, max = 1600, quality = 0.82) {
  return new Promise((resolve) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      try {
        const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
        const w = Math.max(1, Math.round(img.naturalWidth * k)), h = Math.max(1, Math.round(img.naturalHeight * k));
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        c.toBlob((blob) => { URL.revokeObjectURL(url); resolve(blob ? { blob, w, h } : null); }, 'image/jpeg', quality);
      } catch (e) { URL.revokeObjectURL(url); resolve(null); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(null); };
    img.src = url;
  });
}
async function uploadFiles(fileList, ctx) {
  if (!canWriteField()) { toast('אין לך הרשאת עריכה'); return; }
  const files = [...(fileList || [])]; if (!files.length) return;
  const up = S.ui.uploads; up.active += files.length; renderUploadNote();
  for (const file of files) {
    const isImg = /^image\//.test(file.type) || /\.(jpe?g|png|heic|heif|webp)$/i.test(file.name);
    const isAud = /^audio\//.test(file.type) || /\.(m4a|mp3|wav|aac|ogg|opus|caf)$/i.test(file.name);
    const isVid = !isAud && (/^video\//.test(file.type) || /\.(mp4|mov|m4v|webm)$/i.test(file.name));
    const isPdf = !isImg && !isAud && !isVid && (file.type === 'application/pdf' || /\.pdf$/i.test(file.name));
    const id = uid('f');
    let blob = file, ext = (file.name.split('.').pop() || 'bin').toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 8) || 'bin', mime = file.type || 'application/octet-stream', w = null, h = null;
    if (isImg) { const s = await shrinkImage(file); if (s) { blob = s.blob; ext = 'jpg'; mime = 'image/jpeg'; w = s.w; h = s.h; } }
    // folder per context: project / visit | set | task | presentation | general; a task without a project lives under tasks/
    const path = `${ctx.projectId || 'tasks'}/${ctx.visitId || ctx.setId || ctx.materialId || ctx.taskId || ctx.slot || 'general'}/${id}.${ext}`;
    try {
      const { error } = await sb.storage.from(FILE_BUCKET).upload(path, blob, { contentType: mime, upsert: false });
      if (error) throw error;
      const ok = await createDoc('files', id, { bucket: FILE_BUCKET, path, projectId: ctx.projectId || null, visitId: ctx.visitId || null, itemId: ctx.itemId || null, taskId: ctx.taskId || null, slot: ctx.slot || null, setId: ctx.setId || null, materialId: ctx.materialId || null, kind: isImg ? 'image' : isAud ? 'audio' : isVid ? 'video' : isPdf ? 'pdf' : 'file', mime, size: blob.size, width: w, height: h, caption: ctx.caption || ((isImg || isAud) && (ctx.visitId || ctx.itemId) ? '' : file.name) /* visit photos stay caption-less; documents keep their file name */, takenAt: file.lastModified ? new Date(file.lastModified).toISOString() : null, uploadedBy: me()?.id || null, durationSec: ctx.durationSec || null, transcript: '', transcribeStatus: '', transcribeError: '' });

/* lay the flow blocks out on A4 pages (measured in the DOM), repeating the table head when a page starts mid-table */
function paginateReport() {
  const flow = document.getElementById('rp-flow'), out = document.getElementById('rp-pages');
  if (!flow || !out) return;
  const PAGE_H = 1123, PAD = 56, MAX = PAGE_H - PAD * 2 - 30; // A4 @96dpi minus margins and the page footer line
  const blocks = [...flow.children];
  const pages = []; let cur = [], h = 0, lastHead = null;
  blocks.forEach((el) => {
    const bh = el.getBoundingClientRect().height + 8;
    if (el.classList.contains('rp-thead')) lastHead = el;
    if (h + bh > MAX && cur.length) {
      pages.push(cur); cur = []; h = 0;
      if (el.classList.contains('rp-tr') && lastHead) { const c = lastHead.cloneNode(true); cur.push(c); h += lastHead.getBoundingClientRect().height + 8; }
    }
    cur.push(el.cloneNode(true)); h += bh;
  });
  if (cur.length) pages.push(cur);
  out.innerHTML = '';
  pages.forEach((els, i) => {
    const pg = document.createElement('div'); pg.className = 'rp-page';
    const inner = document.createElement('div'); inner.className = 'rp-page-in';
    els.forEach((el) => inner.appendChild(el));
    const foot = document.createElement('div'); foot.className = 'rp-pagefoot'; foot.innerHTML = `<span>${esc(settings().officeName || 'OBERSON')} GO · ${esc(document.title.replace(/ — .*$/, ''))}</span><span>עמוד ${i + 1} מתוך ${pages.length}</span>`;
    pg.appendChild(inner); pg.appendChild(foot); out.appendChild(pg);
  });
  flow.hidden = true;
}
const loadScriptOnce = (src) => new Promise((res, rej) => { if ([...document.scripts].some((s) => s.src === src)) return res(); const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('script ' + src)); document.head.appendChild(s); });
async function makeReportPdf(visitId) {
  const v = S.site_visits[visitId]; if (!v) return;
  S.ui.pdfBusy = true; render();

  try {
    await Promise.all([loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js'), loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js')]);

    await Promise.all([...document.querySelectorAll('#rp-pages img')].map((img) => img.complete ? null : new Promise((r) => { img.onload = r; img.onerror = r; })));

    const blob = pdf.output('blob');

    try {

      const { error } = await sb.storage.from(FILE_BUCKET).upload(path, blob, { contentType: 'application/pdf' });
      if (!error) await createDoc('files', id, { bucket: FILE_BUCKET, path, projectId: v.projectId, visitId: v.id, itemId: null, kind: 'pdf', mime: 'application/pdf', size: blob.size, width: null, height: null, caption: name, takenAt: null, uploadedBy: me()?.id || null });

async function startRecording(visitId) {
  if (S.ui.rec) return;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const type = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus'].find((t) => MediaRecorder.isTypeSupported(t)) || '';
    const recorder = new MediaRecorder(stream, type ? { mimeType: type, audioBitsPerSecond: 64000 } : undefined);
    const chunks = [];
    recorder.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
    recorder.onstop = () => {
      const r = S.ui.rec; S.ui.rec = null; clearInterval(r && r.timer);
      stream.getTracks().forEach((t) => t.stop());
      const mime = recorder.mimeType || type || 'audio/webm';
      const ext = /mp4/.test(mime) ? 'm4a' : /ogg/.test(mime) ? 'ogg' : 'webm';
      const blob = new Blob(chunks, { type: mime });
      const v = S.site_visits[visitId];
      if (blob.size < 1000 || !v) { toast('ההקלטה ריקה'); render(); return; }
      const file = new File([blob], `recording-${todayStr()}.${ext}`, { type: mime, lastModified: Date.now() });
      uploadFiles([file], { projectId: v.projectId, visitId, caption: 'הקלטה ' + fmtDateTime(nowIso()), durationSec: r ? Math.round((Date.now() - r.startedAt) / 1000) : null });
      render();
    };
    recorder.start(1000);
    S.ui.rec = { visitId, recorder, startedAt: Date.now(), timer: setInterval(() => { const el = document.getElementById('rec-timer'); if (el && S.ui.rec) el.textContent = fmtDur((Date.now() - S.ui.rec.startedAt) / 1000); }, 1000) };
    render();
  } catch (e) { console.warn(e); toast(/NotAllowed|Permission/i.test(String(e)) ? 'אין הרשאה למיקרופון' : 'ההקלטה לא נתמכת בדפדפן הזה'); }
}

/* ---------- data ---------- */
async function newPlanSet(pid) {
  const p = S.projects[pid]; if (!p || !isMember()) return null;
  const prev = latestSet(pid);
  const seq = Math.max(0, ...setsOf(pid).map((s) => Number(s.seq) || 0)) + 1;
  const id = uid('ps');
  const ok = await createDoc('plan_sets', id, { projectId: pid, seq, status: prev ? prev.status : 'review', issuedAt: todayStr(), note: '', createdBy: me()?.id || null });
  return ok ? id : null;
}
async function deletePlanSet(id) {
  const s = S.plan_sets[id]; if (!s) return;
  setFiles(id).forEach((f) => deleteFile(f.id));
  await deleteDoc('plan_sets', id);
}

/* ---------- menus & actions ---------- */
function filesMenu(kind, id, anchor) {
  if (kind !== 'setstatus') return false;
  if (!isMember()) { toast('אין לך הרשאת עריכה'); return true; }
  const s = S.plan_sets[id]; if (!s) return true;
  openMenu(anchor, { items: SET_ORDER.map((k) => ({ label: SET_STATUS[k].label, sub: SET_STATUS[k].hint, value: k, selected: s.status === k })), onPick: (it) => patchDoc('plan_sets', id, { status: it.value }) });
  return true;
}
async function filesAction(a, ds, t, e) {
  switch (a) {
    case 'files-toggle': S.ui.filesOpen[ds.key] = !S.ui.filesOpen[ds.key]; render(); return true;
    case 'set-toggle': { e.stopPropagation(); const s = S.plan_sets[ds.id]; if (!s) return true; const latest = latestSet(s.projectId); const key = ds.id; const cur = key in S.ui.setOpen ? S.ui.setOpen[key] : (latest && latest.id === key); S.ui.setOpen[key] = !cur; render(); return true; }
    case 'set-new': {
      if (!isMember()) { toast('אין לך הרשאת עריכה'); return true; }
      const id = await newPlanSet(ds.id); if (!id) return true; // the newest set opens by itself (latest = open by default)
      render();
      setTimeout(() => document.getElementById('set-' + id)?.scrollIntoView({ block: 'nearest' }), 60);
      return true;
    }
    case 'set-status': { e.stopPropagation(); if (!isMember()) { toast('אין לך הרשאת עריכה'); return true; } patchDoc('plan_sets', ds.id, { status: ds.value }); return true; }
    case 'set-del': {
      e.stopPropagation();
      const s = S.plan_sets[ds.id]; if (!s) return true;
      if (!canDeleteSet(s)) { toast('מחיקת סט: מי שיצר אותו, ראשי צוותים ומנהלים'); return true; }
      if (!ds.confirmed) { S.ui.confirm = 'set:' + ds.id; render(); return true; }
      S.ui.confirm = null; await deletePlanSet(ds.id); toast('הסט נמחק'); return true;
    }
    default: return false;
  }
}

const SHOOT_STATUS = {

};
const SHOOT_ORDER = ['open', 'scheduled', 'shot', 'published'];
const SHOOT_FN = { managers: 'הנהלה', admin: 'אדמיניסטרציה', pr: 'יחסי ציבור', social: 'סושיאל', lead: 'מוביל/ת הפרויקט' };
const DEFAULT_SHOOT_STEPS = [

  { text: 'תיאום צלם/ת ומועד', fn: 'admin' },
  { text: 'תיאום צוות הסושיאל ואנשי צוות נוספים ליום הצילום', fn: 'social' },
  { text: 'סטיילינג לצילומים — סטייליסט/ית, אביזרים, פרחים', fn: 'pr' },
  { text: 'גיוס שותפים למימון יום הצילום — קבלנים וספקים', fn: 'managers' },
  { text: 'הפקת יום הצילום — לו"ז, נוכחים, גישה לנכס', fn: 'admin' },

  { text: 'פרסום ברשתות ובעיתונות', fn: 'social' },
];
const FUND_STATUS = { asked: { label: 'פנינו', cls: 'dim' }, agreed: { label: 'אישר', cls: 'yellow' }, paid: { label: 'שילם', cls: 'green' }, declined: { label: 'סירב', cls: 'red' } };
S.shoots = {}; S.shoot_funding = {};

const fundingOf = (sid) => list('shoot_funding').filter((f) => f.shootId === sid).sort((a, b) => (a.createdAt || '').localeCompare(b.createdAt || ''));

/* who gets a step of a given function — the first user found; managers when nobody is set */
function usersForFn(fn, p) {
  const users = activeUsers();
  const byRole = (roles) => users.filter((u) => roles.includes(u.role)).map((u) => u.id);
  const managers = () => { const st = settings(); return st.partnerUserId && users.some((u) => u.id === st.partnerUserId) ? [st.partnerUserId] : byRole(['owner', 'manager']); };
  const fns = shootFns();
  if (fn === 'managers') return managers();
  if (fn === 'admin') { const a = byRole(['admin']); return a.length ? a : managers(); }
  if (fn === 'pr') { const a = (fns.pr || []).filter((id) => users.some((u) => u.id === id)); return a.length ? a : managers(); }
  if (fn === 'social') { const a = (fns.social || []).filter((id) => users.some((u) => u.id === id)); return a.length ? a : usersForFn('pr', p); }
  if (fn === 'lead') { const ids = [p?.leadId, teamLeadId(p?.teamId)].filter(Boolean); for (const cid of ids) { const u = users.find((x) => x.contactId === cid); if (u) return [u.id]; } return managers(); }
  return managers();
}
async function ensureShoot(pid, opts = {}) {
  const p = S.projects[pid]; if (!p || !isMember()) return null;
  const have = shootOf(pid); if (have) return have.id;
  const id = uid('sh');
  const ok = await createDoc('shoots', id, { projectId: pid, status: 'open', openedAt: todayStr(), shootDate: null, shootDates: '', photographerId: null, stylistId: null, partnerIds: [], notes: '', createdBy: me()?.id || null });
  if (!ok) return null;
  const steps = shootSteps();
  let i = 0;
  for (const step of steps) {
    const assignee = usersForFn(step.fn, p)[0] || null;
    await newTask({ title: step.text, description: `צילום ופרסום · ${SHOOT_FN[step.fn] || ''}`, projectId: pid, assigneeId: assignee, shootId: id, sortIndex: ++i });
  }
  if (!opts.quiet) toast(`נפתח שלב צילום ופרסום ל«${p.name}» — ${steps.length} משימות חולקו`);
  return id;
}

/* ===================== meetings: every meeting summary in one place ===================== */
/* A meeting is a site_visits row of kind 'meeting' (same editor and report as a site visit: participants, summary, decisions and tasks,
   photos, recording). Since 2.10.2026 it also has a venue (office / zoom / site / client / other), a subject, and may belong to no
   project at all (a general office meeting). The שטח tab keeps the site visits; this tab shows the meetings — upcoming ones first. */
Object.assign(S.ui, { mvenue: '', mmine: false, mq: '' });
const MEETINGS = () => SV().filter((v) => v.kind === 'meeting');
const byDateDesc = (a, b) => (b.visitDate || '').localeCompare(a.visitDate || '') || (b.createdAt || '').localeCompare(a.createdAt || '');
const meetingsSorted = () => MEETINGS().sort(byDateDesc);
/* decisions and tasks still open, from meetings of active projects (and general meetings) */
const openMeetingItems = () => VI().filter(isOpenItem).map((it) => ({ it, v: S.site_visits[it.visitId] }))
  .filter((x) => x.v && x.v.kind === 'meeting' && (!x.v.projectId || S.projects[x.v.projectId]?.state === 'active'))
  .sort((a, b) => (a.it.dueDate || '9999').localeCompare(b.it.dueDate || '9999') || (b.v.visitDate || '').localeCompare(a.v.visitDate || ''));
/* what is already on the calendar: summaries dated after today (a meeting prepared ahead — today's are in the lists below), and meeting
   requests administration has set (or is still to set) for today or later — everything the person is allowed to see */
function upcomingMeetings(days = 14) {
  const today = todayStr(); const until = todayStr(new Date(Date.now() + days * 864e5));
  const out = MEETINGS().filter((v) => (v.visitDate || '') > today && (v.visitDate || '') <= until)
    .map((v) => ({ date: v.visitDate, time: v.visitTime || '', label: visitLabel(v), sub: [visitProjectName(v), venueLabel(v), v.status === 'final' ? 'סוכם' : ''].filter(Boolean).join(' · '), attrs: `data-action="open-visit" data-id="${v.id}"`, icon: ICON.doc }));
  (typeof R === 'function' ? R() : []).filter((r) => r.kind === 'meeting' && ['open', 'done'].includes(r.status) && r.startDate && r.startDate >= today && r.startDate <= until)
    .forEach((r) => out.push({ date: r.startDate, time: r.atTime || '', label: r.title || 'פגישה', sub: [r.projectId && S.projects[r.projectId] ? S.projects[r.projectId].name : (REQ_SCOPES[r.scope] || ''), REQ_MEETING[r.meetingType] || '', r.status === 'open' ? 'ממתינה לקביעה' : 'נקבעה', uname(r.requesterId, '')].filter(Boolean).join(' · '), attrs: `data-action="open-request" data-id="${r.id}"`, icon: ICON.pin, pending: r.status === 'open' }));
  return out.sort((a, b) => a.date.localeCompare(b.date) || a.time.localeCompare(b.time));
}
const upcomingRow = (u) => `<div class="task-item" ${u.attrs}>
    <span class="visit-ic">${u.icon}</span>

function sundayMenu(kind, id, anchor) {

  else if (kind === 'srproject') openMenu(anchor, { search: true, placeholder: 'איזה פרויקט?', items: [{ label: 'ללא פרויקט', value: '', selected: !r.projectId }, ...activeProjects().filter((p) => !isReduced(p)).sort(byName).map((p) => ({ label: p.name, sub: [p.number, p.city].filter(Boolean).join(' · '), value: p.id, selected: r.projectId === p.id }))], onPick: (it) => patchDoc('sunday_requests', id, { projectId: it.value || null }) });
  else if (kind === 'srwith') { // + : anyone from the office (team members included), not only the partners and the lead

async function sundayAction(a, ds, t, e) {
  switch (a) {
    case 'goto-sunday': S.ui.mtab = 'sunday'; nav('meetings'); return true;
    case 'sunday-shift': { const d = Number(ds.days); S.ui.sundayDate = d ? addDays(sundayDate(), d) : null; render(); return true; }
    case 'sunday-print': { document.body.classList.add('sunday-print'); setTimeout(() => { window.print(); setTimeout(() => document.body.classList.remove('sunday-print'), 500); }, 50); return true; }
    case 'sr-add': {
      const inp = document.getElementById(ds.input); const topic = (inp?.value || '').trim(); if (!topic) { inp?.focus(); return true; }
      inp.value = '';
      const fields = { topic }; if (ds.team) fields.teamId = ds.team;
      const id = await newSundayRequest(fields);
      setTimeout(() => { document.getElementById(ds.input)?.focus(); if (id) document.getElementById('sr-' + id)?.scrollIntoView({ block: 'nearest' }); }, 30);
      return true;
    }
    case 'sr-del': { // irreversible → one "הסר / בטל" step first
      e.stopPropagation(); const r = S.sunday_requests[ds.id]; if (!r) return true;
      if (!canEditRequest(r)) { toast('רק מי שרשם את הנושא, ראש/ת הצוות או מנהל/ת'); return true; }
      if (!ds.confirmed) { S.ui.confirm = 'sr:' + ds.id; render(); return true; }
      S.ui.confirm = null; await deleteDoc('sunday_requests', ds.id); return true;
    }
    case 'sr-with-toggle': {
      e.stopPropagation(); const r = S.sunday_requests[ds.id]; if (!r) return true;
      if (!canEditRequest(r)) { toast('רק מי שרשם את הנושא, ראש/ת הצוות או מנהל/ת'); return true; }
      const cur = r.withIds || []; patchDoc('sunday_requests', ds.id, { withIds: cur.includes(ds.value) ? cur.filter((x) => x !== ds.value) : [...cur, ds.value] }); return true;
    }
    case 'sr-other-set': { const r = S.sunday_requests[ds.id]; const inp = document.getElementById('sr-other-' + ds.id); const m = Math.round(Number(inp?.value)); S.ui.sundayOther = null; if (r && m > 0) patchDoc('sunday_requests', ds.id, { minutes: m }); else render(); return true; }
    case 'st-priority': { if (!leadsOf(ds.team)) { toast('ראש/ת הצוות או מנהל/ת'); return true; } const id = await ensureTeamRow(ds.sunday, ds.team); if (id) patchDoc('sunday_teams', id, { priority: Number(ds.value) }); return true; }
    case 'st-ready': { if (!leadsOf(ds.team)) { toast('ראש/ת הצוות או מנהל/ת'); return true; } const id = await ensureTeamRow(ds.sunday, ds.team); if (id) { patchDoc('sunday_teams', id, ds.value === '1' ? { readyAt: nowIso(), readyBy: me().id } : { readyAt: null, readyBy: null }); toast(ds.value === '1' ? 'הרשימה סומנה כמוכנה' : 'הרשימה נפתחה לעריכה'); } return true; }
    case 'st-move': { // managers: manual order of the teams (sort_index), starting from the computed order
      if (!isManager()) return true;
      const order = teamOrder(ds.sunday).filter((x) => x.team); const i = order.findIndex((x) => x.team.id === ds.team); const j = i + Number(ds.dir);
      if (i < 0 || j < 0 || j >= order.length) return true;
      const ids = order.map((x) => x.team.id); [ids[i], ids[j]] = [ids[j], ids[i]];
      for (let k = 0; k < ids.length; k++) { const id = await ensureTeamRow(ds.sunday, ids[k]); if (id) patchDoc('sunday_teams', id, { sortIndex: k + 1 }); }
      return true;
    }
    case 'sundaywith-remove': { if (!isManager()) return true; patchSettings({ sundayWith: sundayPeople().map((c) => c.id).filter((id) => id !== ds.id) }); return true; }
    default: return false;
  }
}

  const byName = new Map(existing.map((c) => [norm(c.name), c]));
  const byEmail = new Map(existing.filter((c) => c.email).map((c) => [norm(c.email), c]));
