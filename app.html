/* ---------- actions ---------- */
async function projectAction(a, ds, t, e) {
  switch (a) {
    case 'open-project': openProjectPage(ds.id); return true;
    case 'open-project-page': openProjectPage(ds.id); return true;
    case 'scroll-to': { e.preventDefault(); const el = document.getElementById(ds.target); if (el) el.scrollIntoView({ block: 'start', behavior: 'smooth' }); return true; }
    case 'photos-all': S.ui.photoFilter = 'all'; render(); return true;
    case 'field-filter': S.ui.fieldFilter = ds.value || ''; render(); return true;
    case 'goto-journey': showProjectSection(ds.id, 'journey'); return true;
    case 'share-add': {
      e.stopPropagation(); const p = S.projects[ds.id]; if (!p || !canShare(p)) { toast('שיתוף: מנהלים, ראשי צוותים ומוביל/ת הפרויקט'); return true; }
      const have = sharesOf(p.id);
      const teams = T().filter((tm) => tm.id !== p.teamId && !have.some((s) => s.teamId === tm.id)).map((tm) => ({ label: tm.name, sub: 'צוות', value: 'team:' + tm.id }));
      const users = activeUsers().filter((u) => !have.some((s) => s.userId === u.id) && !['owner', 'manager'].includes(u.role)).map((u) => ({ label: uname(u.id), sub: ROLE_LABELS[u.role] || '', value: 'user:' + u.id }));
      openMenu(t, { search: true, placeholder: 'לשתף עם צוות או אדם…', items: [...teams, ...users], onPick: (it) => { const [kind, id] = it.value.split(':'); createDoc('project_shares', uid('shr'), { projectId: p.id, userId: kind === 'user' ? id : null, teamId: kind === 'team' ? id : null, createdBy: me()?.id || null }); } });
      return true;
    }
    case 'share-remove': { const s = S.project_shares[ds.id]; if (!s) return true; const p = S.projects[s.projectId]; if (!canShare(p)) { toast('אין לך הרשאת עריכה'); return true; } await deleteDoc('project_shares', s.id); return true; }
    case 'goto-files': showProjectSection(ds.id, 'files-section'); return true;
    default: return false;
  }
}

/* who gets a step of a given function — the first user found; managers when nobody is set */
function usersForFn(fn, p) {
  const users = activeUsers();
  const byRole = (roles) => users.filter((u) => roles.includes(u.role)).map((u) => u.id);
  const managers = () => { const st = settings(); return st.partnerUserId && users.some((u) => u.id === st.partnerUserId) ? [st.partnerUserId] : byRole(['owner', 'manager']); };
  const fns = shootFns();

  if (fn === 'admin') { const a = byRole(['admin']); return a.length ? a : managers(); }
  if (fn === 'pr') { const a = (fns.pr || []).filter((id) => users.some((u) => u.id === id)); return a.length ? a : managers(); }
  if (fn === 'social') { const a = (fns.social || []).filter((id) => users.some((u) => u.id === id)); return a.length ? a : usersForFn('pr', p); }
  if (fn === 'lead') { const ids = [p?.leadId, teamLeadId(p?.teamId)].filter(Boolean); for (const cid of ids) { const u = users.find((x) => x.contactId === cid); if (u) return [u.id]; } return managers(); }

async function ensureShoot(pid, opts = {}) {

  if (!ok) return null;
  const steps = shootSteps();

async function seatingAction(a, ds, t, e) {
  switch (a) {
    case 'seat-open': { if (!canSeeSeating()) return true; openDrawer('seat', ds.id); return true; }
    case 'seat-room': { if (!canEditSeating()) return true; openDrawer('room', ds.id); return true; }
    case 'seat-print': { if (!canSeeSeating()) return true; printSeating(); return true; }
    case 'seat-clear': { if (!canEditSeating()) { toast('צפייה בלבד'); return true; } await ensureSeatRow(ds.id, 'desk'); patchDoc('seats', ds.id, { contactId: null }); return true; }
    case 'seat-pick': {
      if (!canEditSeating()) { toast('צפייה בלבד'); return true; }
      const id = ds.id; const cur = seatRow(id)?.contactId || null;
      const items = C().filter((c) => c.type === 'employee' && c.active !== false && c.id !== cur).sort((x, y) => (isFreelancer(x) - isFreelancer(y)) || byName(x, y))
        .map((c) => { const where = seatOfContact(c.id); return { label: c.name, sub: [isFreelancer(c) ? 'פרילנסר/ית' : tname(c.teamId, ''), where ? 'יושב/ת ב' + seatLabel(where.id) + ' (' + seatZone(where.id) + ')' : ''].filter(Boolean).join(' · '), value: c.id }; });
      openMenu(t, { search: true, placeholder: 'חיפוש עובד/ת…', emptyText: 'אין תוצאות', items, onPick: (it) => seatContact(id, it.value) });
      return true;
    }
    default: return false;
  }
}

function openDrawer(kind, id) { S.ui.menu = null; S.ui.confirm = null; S.ui.drawer = { kind, id }; render(); }
function closeDrawer(force) {

const MS_STATE = { todo: { label: 'טרם התחיל', icon: 'phTodo', next: 'active' }, active: { label: 'בתהליך', icon: 'phActive', next: 'done' }, done: { label: 'הושלם', icon: 'phDone', next: 'todo' } };

function parseImport(text, type) {
  const lines = text.replace(/\r/g, '').split('\n').filter((l) => l.trim());
  if (lines.length < 2) return { error: 'צריך לפחות שורת כותרות ושורה אחת של נתונים' };
  const sep = lines[0].includes('\t') ? '\t' : lines[0].includes(';') ? ';' : ',';
  const split = (l) => l.split(sep).map((x) => x.trim().replace(/^"|"$/g, ''));
  const header = split(lines[0]).map((h) => norm(h));
  const aliases = { name: ['שם', 'שם מלא', 'name', 'שם העובד', 'שם הספק', 'שם הלקוח', 'חברה / שם'], company: ['חברה', 'company', 'שם חברה', 'משרד'], role: ['תפקיד', 'הגדרה', 'הגדרה בצוות', 'role', 'איש קשר'], category: ['תחום', 'קטגוריה', 'category'], phone: ['טלפון', 'נייד', 'phone', 'טלפון נייד'], email: ['מייל', 'אימייל', 'דואל', 'דוא"ל', 'email', 'כתובת מייל'], team: ['צוות', 'team'], employeeNumber: ['מס עובד', "מס' עובד", 'מספר עובד', 'employee number'], startDate: ['תחילת עבודה', 'תאריך תחילת עבודה', 'start date', 'תאריך התחלה'], notes: ['הערות', 'notes', 'הערה'], first: ['שם פרטי', 'first name'], last: ['שם משפחה', 'last name'] };
  const idx = {};
  Object.entries(aliases).forEach(([k, arr]) => { const i = header.findIndex((h) => arr.map(norm).includes(h)); if (i >= 0) idx[k] = i; });
  if (idx.name == null && !(idx.first != null && idx.last != null)) return { error: 'לא נמצאה עמודת "שם" (או "שם פרטי" + "שם משפחה")' };
  const existing = C().filter((c) => c.type === type);
  const byName = new Map(existing.map((c) => [norm(c.name), c]));
  const byEmail = new Map(existing.filter((c) => c.email).map((c) => [norm(c.email), c]));
  const teamsByName = new Map(T().map((t) => [norm(t.name), t]));
  const rows = [];
  for (const line of lines.slice(1)) {
    const cells = split(line);
    const get = (k) => (idx[k] != null ? (cells[idx[k]] || '').trim() : '');
    const name = get('name') || [get('first'), get('last')].filter(Boolean).join(' ');
    if (!name) continue;

    const sd = get('startDate'); if (sd) { const m = sd.match(/(\d{1,2})[./-](\d{1,2})[./-](\d{2,4})/); if (m) { let y = Number(m[3]); if (y < 100) y += 2000; d.startDate = `${y}-${String(m[2]).padStart(2, '0')}-${String(m[1]).padStart(2, '0')}`; } else if (/^\d{4}-\d{2}-\d{2}/.test(sd)) d.startDate = sd.slice(0, 10); }
    const teamName = get('team'); let teamId = null;
    if (teamName) { const t = teamsByName.get(norm(teamName)) || T().find((x) => norm(x.name).includes(norm(teamName))); if (t) teamId = t.id; }
    if (teamId) d.teamId = teamId;
    if (idx.first != null) { d.firstName = get('first'); d.lastName = get('last'); }
    const match = byName.get(norm(name)) || (d.email && byEmail.get(norm(d.email)));
    if (match) {
      const patch = {}; Object.entries(d).forEach(([k, v]) => { if (k !== 'name' && v && (match[k] == null || match[k] === '')) patch[k] = v; });
      rows.push({ action: Object.keys(patch).length ? 'update' : 'skip', id: match.id, data: Object.assign({ name: match.name }, patch), teamName, reason: Object.keys(patch).length ? '' : 'קיים, אין שדות חדשים' });
    } else rows.push({ action: 'create', data: d, teamName });
  }
  return { rows };
}

    ...projects.map((p) => [p.number || '', p.name, p.type || '', p.typeDetail || '', p.city || '', p.address || '', cname(p.clientId, ''), tname(p.teamId, ''), cname(teamLeadId(p.teamId), ''), cname(p.leadId, ''), names(p.memberIds), cname(p.pmId, ''), names(p.contractorIds), names(p.consultantIds), names(p.supplierIds), names(p.partnerIds), STATES[p.state] || p.state, activePhases(p).map((x) => x.name).join(' + '), projectPhases(p).map((x) => `${x.name} (${PHASE_STATES[x.state].label})`).join(', '), HEALTH[p.health]?.label || '', sizeOf(p.size)?.name || '', p.statusNote || '', fmtDate(p.statusUpdatedAt), fmtDate(p.startDate), fmtDate(p.dueDate), p.needsReview ? 'כן' : '', p.notes || ''])];
  const cRows = [['סוג', 'שם', 'חברה', 'תפקיד / הגדרה', 'תחום', 'צוות', 'טלפון', 'מייל', 'מס\' עובד', 'תחילת עבודה', 'פעיל', 'פרויקטים מקושרים', 'הערות'],
    ...C().sort((a, b) => a.type.localeCompare(b.type) || byName(a, b)).map((c) => [CTYPES[c.type]?.label || c.type, c.name, c.company || '', c.role || '', c.category || '', tname(c.teamId, ''), c.phone || '', c.email || '', c.employeeNumber || '', fmtDate(c.startDate), c.active === false ? 'לא' : 'כן', projectsOfContact(c.id).map((p) => p.name).join(', '), c.notes || ''])];
  const kRows = [['פרויקט', 'ספק', 'סכום', 'סטטוס', 'תאריך צפוי', 'תאריך חשבונית', 'תאריך תשלום', 'הערה'],
    ...K().map((k) => [S.projects[k.projectId]?.name || '', cname(k.supplierId, ''), k.amount ?? '', COMM_STATUS[k.status]?.label || k.status, fmtDate(k.expectedDate), fmtDate(k.invoiceDate), fmtDate(k.paidDate), k.note || ''])];
  const tRows = [['צוות', 'ראש צוות', 'חברי צוות (הגדרה)', 'פרויקטים פעילים'], ...T().map((t) => [t.name, cname(t.leadId, ''), employees().filter((e) => e.teamId === t.id && e.id !== t.leadId).map((e) => e.name + (e.role ? ' (' + e.role + ')' : '')).join(', '), activeProjects().filter((p) => p.teamId === t.id).length])];
  const sheets = [
    { name: 'פרויקטים', rows: pRows, widths: [10, 36, 16, 14, 14, 20, 30, 12, 16, 16, 24, 18, 20, 20, 20, 8, 16, 50, 12, 8, 40, 12, 12, 12, 8, 30] },
    { name: 'אנשי קשר', rows: cRows, widths: [12, 30, 30, 20, 16, 12, 16, 26, 8, 12, 6, 50, 30] },
    { name: 'צוותים', rows: tRows, widths: [16, 20, 60, 12] },
  ];
  if (isManager()) sheets.splice(2, 0, { name: 'עמלות', rows: kRows, widths: [36, 26, 12, 14, 12, 12, 12, 40] });
  const data = xlsxBuild(sheets);
  const stamp = new Date().toISOString().slice(0, 10);
  try { downloadBytes(`OBERSON GO ${stamp}.xlsx`, data); toast('הקובץ ירד'); }
  catch (err) { toast('הייצוא נכשל: ' + (err?.message || '')); }
}
